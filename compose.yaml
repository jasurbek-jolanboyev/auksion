services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: euylar
      POSTGRES_USER: euylar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tashkent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euylar -d euylar"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://euylar:${POSTGRES_PASSWORD}@db:5432/euylar
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://euylar:${POSTGRES_PASSWORD}@db:5432/euylar
      UPLOAD_DIR: ./uploads
    volumes:
      - property-media:/app/apps/api/uploads
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/bot.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://euylar:${POSTGRES_PASSWORD}@db:5432/euylar
      UPLOAD_DIR: ./uploads
    volumes:
      - property-media:/app/apps/api/uploads
    networks: [edge, backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
    restart: unless-stopped
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_HOST:?Set ADMIN_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    networks: [edge]

volumes:
  postgres-data:
  property-media:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge:
