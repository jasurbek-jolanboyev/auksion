function toast(t){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3400)}
function navigate(path){if(location.hash==='#'+path)render();else location.hash=path}
function route(){let [path,q='']=location.hash.slice(1).split('?');return {path:path||'/',params:new URLSearchParams(q)}}
function breadcrumb(name){return `<div class="breadcrumbs"><a href="#/">Bosh sahifa</a><span>›</span><span>${esc(name)}</span></div>`}
function demoToggleFavorite(id){id=+id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];write('favorites',state.favorites);updateHeader();document.querySelectorAll(`[data-heart="${id}"]`).forEach(b=>{b.classList.toggle('saved',state.favorites.includes(id));b.setAttribute('aria-pressed',String(state.favorites.includes(id)))});if(route().path==='/favorites')render();else toast(state.favorites.includes(id)?'Sevimlilarga saqlandi':'Sevimlilardan olib tashlandi')}
function card(p){return `<article class="card"><div class="photo"><a href="#/property/${p.id}" aria-label="${esc(p.title)}"><img src="${photo(p)}" alt="${esc(p.title)}" loading="lazy"></a><span class="badge ${p.tag==='TOP'?'pink':p.tag==='Tekshirilgan'?'green':''}">${p.tag==='Tekshirilgan'?'✓ ':''}${esc(p.tag||'Yangi')}</span><button class="heart ${state.favorites.includes(p.id)?'saved':''}" data-heart="${p.id}" aria-label="Sevimlilarga saqlash" aria-pressed="${state.favorites.includes(p.id)}" onclick="toggleFavorite(${p.id})">${icon('heart')}</button></div><div class="cardbody"><div class="price">${money(p.price)} <span style="font-size:12px;font-weight:500">so‘m${p.deal==='rent'?' / oy':''}</span></div><a class="card-title" href="#/property/${p.id}">${esc(p.title)}</a><div class="facts">${p.rooms?`<span>${p.rooms} xona</span><span>·</span>`:''}<span>${p.area} m²</span>${p.floor?`<span>·</span><span>${p.floor}/${p.floors} qavat</span>`:p.land?`<span>·</span><span>${p.land} sotix</span>`:''}</div><div class="card-bottom"><span>${esc(p.district)}, ${esc(p.region)}</span><span>${esc(p.date)}</span></div></div></article>`}
function lotCard(l){let ended=l.stage==='ended';return `<article class="auction-card"><a class="photo" href="#/auction/${l.id}"><img src="${PHOTOS[l.photo]}" alt="${esc(l.title)}" loading="lazy"><span class="badge ${l.stage==='live'?'pink':ended?'':'blue'}">${l.stage==='live'?'● Joriy savdo':ended?'Yakunlangan':'Auksion'} · № ${l.id}</span></a><div class="inner"><div class="tiny muted">${esc(l.region)} · ${esc(l.district)} · ${l.area} m²</div><a href="#/auction/${l.id}"><h3>${esc(l.title)}</h3></a><div class="tiny muted">Boshlang‘ich narx</div><div class="price">${money(l.price)} <span style="font-size:12px">so‘m</span></div><div class="info-pair"><span class="muted">Zakalat puli (20%)</span><strong>${money(l.deposit)} so‘m</strong></div><div class="timer">${icon('clock')}<span>${ended?'Savdo yakunlangan':new Date(l.date).toLocaleString('uz-UZ',{timeZone:'Asia/Tashkent',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div><a class="btn outline small" href="#/auction/${l.id}">Lotni ko‘rish ${icon('arrow')}</a></div></article>`}
function projectCard(p){return `<article class="project"><a href="#/project/${p.id}" class="photo"><img src="${PHOTOS[p.photo]}" alt="${esc(p.name)} turar joy majmuasi" loading="lazy"><span class="badge green">${p.end}</span></a><div class="inner"><a href="#/project/${p.id}"><h3>${esc(p.name)} <span class="muted" style="font-weight:400">· ${esc(p.company)}</span></h3></a><div class="muted tiny">Toshkent · ${p.district} tumani</div><div class="project-price">${p.price} so‘mdan</div><div class="info-pair muted"><span>${p.rooms} xonali kvartiralar</span><span>${p.area} m²</span></div><a href="#/project/${p.id}" class="btn outline">Majmua haqida ${icon('arrow')}</a></div></article>`}
function categoryTiles(){return `<div class="categories">${[['apartment','building','Kvartiralar','Sotuv va ijara'],['house','home','Hovli uylar','Oilangiz uchun'],['new','building','Yangi uylar','Quruvchidan'],['land','land','Yer uchastkalari','Imkoniyatlar maydoni'],['commercial','store','Tijorat binolari','Biznes uchun'],['auction','hammer','Auksion lotlari','Ochiq savdolar']].map(([t,i,l,s])=>`<button class="category" onclick="navigate('${t==='new'?'/projects':t==='auction'?'/auctions':'/listings?type='+t}')"><strong>${l}</strong><small>${s}</small><span class="cat-art">${icon(i)}</span></button>`).join('')}</div>`}
function home(){return `<div class="container page"><div class="intro"><div><div class="eyebrow">Yangi manzil. Yangi imkoniyat.</div><h1>O‘z uyingizni e-uylar bilan toping</h1><p class="muted">Sotib oling, ijaraga oling yoki auksionda o‘z imkoniyatingizni toping.</p></div><span class="badge green">${icon('shield')} Ishonchli tanlov, qulay qidiruv</span></div>${categoryTiles()}<form class="filter-strip" onsubmit="quickSearch(event)"><select name="deal" aria-label="Bitim turi"><option value="sale">Sotib olish</option><option value="rent">Ijaraga olish</option></select><select name="type" aria-label="Mulk turi"><option value="">Barcha ko‘chmas mulklar</option value="apartment">Kvartira</option><option value="house">Hovli uy</option><option value="land">Yer uchastkasi</option><option value="commercial">Tijorat binosi</option></select><select name="region" aria-label="Hudud">${regions.map(r=>`<option ${r===state.region?'selected':''}>${r}</option>`).join('')}</select><input name="max" type="number" min="0" aria-label="Maksimal narx" placeholder="Narx, gacha (so‘m)"><button class="btn primary">${icon('filter')} Qidirish</button><a class="btn outline" href="#/map">${icon('map')} Xaritada</a></form><section class="section"><div class="section-head"><h2>Yangi e’lonlar <span class="muted" style="font-size:14px;font-weight:400">/ ${repository.listings().length}</span></h2><a href="#/listings">Barcha e’lonlar →</a></div><div class="chips" style="margin-bottom:20px" id="home-chips">${[['','Barchasi'],['apartment','Kvartiralar'],['house','Hovli uylar'],['land','Yerlar'],['commercial','Tijorat']].map(([t,l],i)=>`<button class="chip ${i===0?'active':''}" onclick="homeCategory('${t}',this)">${l}</button>`).join('')}</div><div class="grid five" id="home-cards">${repository.listings().slice(0,5).map(card).join('')}</div></section><section class="promo"><div><div class="eyebrow">Sizning mulkingiz. Sizning imkoniyatingiz.</div><h2>Uyingizning yangi egasi shu yerda.</h2><p>E’loningizni bepul joylang. Xaridorlar bilan bevosita bog‘laning.</p></div><span class="promo-art">${icon('home')}</span><a href="#/post" class="btn primary">E’lon joylash ${icon('plus')}</a></section><section class="section"><div class="section-head"><div><h2>Auksiondagi imkoniyatlar <span class="badge pink">● LIVE</span></h2><p class="muted tiny" style="margin:6px 0 0">Yer va ko‘chmas mulklar — ochiq savdolarda</p></div><a href="#/auctions">Barcha lotlar →</a></div><div class="auction-grid">${lots.slice(0,3).map(lotCard).join('')}</div></section><section class="section"><div class="section-head"><div><h2>Yangi uyda yangi hayot</h2><p class="tiny muted" style="margin:6px 0 0">Quruvchilardan zamonaviy turar joy majmualari</p></div><a href="#/projects">Barcha majmualar →</a></div><div class="project-grid">${projects.map(projectCard).join('')}</div></section><section class="section"><div class="section-head"><h2>Hududingizdan izlang</h2><button style="color:var(--pink);font-size:12px" onclick="openRegion()">Barcha hududlar →</button></div><div class="cities">${['Toshkent','Samarqand','Buxoro','Toshkent viloyati'].map(r=>`<a class="city" href="#/listings?region=${encodeURIComponent(r)}">${icon('building')}<div><strong>${r}</strong><small>${repository.listings().filter(p=>p.region===r).length} ta e’lonni ko‘ring →</small></div></a>`).join('')}</div></section></div>`}
function homeCategory(t,b){document.querySelectorAll('#home-chips .chip').forEach(c=>c.classList.remove('active'));b.classList.add('active');let ps=repository.listings().filter(p=>!t||p.type===t);document.getElementById('home-cards').innerHTML=ps.slice(0,5).map(card).join('')||empty('Hozircha e’lon yo‘q','Boshqa turdagi mulkni tanlang.')}
function quickSearch(e){e.preventDefault();const f=new FormData(e.target),q=new URLSearchParams();for(const [k,v]of f)if(v&&v!=='Barcha hududlar')q.set(k,v);navigate('/listings?'+q)}
function empty(t,d,link='/listings',label='E’lonlarni ko‘rish'){return `<div class="empty">${icon('home')}<h3>${t}</h3><p>${d}</p><a href="#${link}" class="btn primary small">${label}</a></div>`}
function field(label,name,placeholder='',type='text',value='',required=false){return `<div class="field"><label for="${name}">${label}${required?' <span style="color:var(--pink)">*</span>':''}</label><input id="${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" '+(['area','land'].includes(name)?'step="0.01"':'step="1"'):''}></div>`}
function selectField(label,name,options,value='',required=false){return `<div class="field"><label for="${name}">${label}${required?' *':''}</label><select id="${name}" name="${name}" ${required?'required':''}>${options.map(x=>{let [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`}).join('')}</select></div>`}
function listings(params){const f=Object.fromEntries(params);let heading=f.type?types[f.type]:f.deal==='rent'?'Ijaraga ko‘chmas mulklar':'Ko‘chmas mulk e’lonlari';state.filters=f;state.page=1;return `<div class="container page">${breadcrumb(heading)}<div class="section-head"><div><h1>${heading||'Ko‘chmas mulklar'}</h1><span class="muted" style="font-size:12px">O‘zingizga mos manzilni tanlang</span></div><a href="#/map?${params}" class="btn outline">${icon('map')} Xaritada</a></div><div class="listing-layout"><aside class="panel filter-panel" id="filter-panel"><form id="filters-form" onsubmit="applyListingFilters(event)"><h3>Filtrlar <button type="button" style="font-size:11px;color:var(--pink)" onclick="navigate('/listings')">Tozalash</button></h3>${selectField('Bitim turi','deal',[['','Barchasi'],['sale','Sotuv'],['rent','Ijara']],f.deal)}${selectField('Mulk turi','type',[['','Barcha turlar'],...Object.entries(types).filter(([k])=>k!=='auction')],f.type)}${selectField('Hudud','region',regions,f.region||'Barcha hududlar')}${selectField('Tuman','district',districts,f.district)}<div class="field"><label>Narx, so‘m</label><div class="two"><input name="min" type="number" min="0" placeholder="Dan" aria-label="Minimal narx" value="${esc(f.min||'')}"><input name="max" type="number" min="0" placeholder="Gacha" aria-label="Maksimal narx" value="${esc(f.max||'')}"></div></div>${selectField('Xonalar soni','rooms',[['','Barchasi'],['1','1 xona'],['2','2 xona'],['3','3 xona'],['4','4+ xona']],f.rooms)}${field('Maydon, m² dan','area','Masalan, 50','number',f.area||'')}<label class="check" style="margin-bottom:15px"><input name="owner" type="checkbox" ${f.owner?'checked':''}> Faqat egasidan</label><label class="check" style="margin-bottom:18px"><input name="verified" type="checkbox" ${f.verified?'checked':''}> Tekshirilgan e’lonlar</label><input type="hidden" name="q" value="${esc(f.q||'')}"><button class="btn primary" style="width:100%">Natijalarni ko‘rsatish</button><button type="button" class="btn soft small" style="width:100%;margin-top:10px" onclick="saveSearch()">♡ Qidiruvni saqlash</button></form></aside><section><div class="chips">${[['','Barchasi'],['sale','Sotuv'],['rent','Ijara']].map(([d,l])=>`<button class="chip ${(f.deal||'')===d?'active':''}" onclick="setQuery('deal','${d}')">${l}</button>`).join('')}${f.q?`<span class="badge pink">“${esc(f.q)}”</span>`:''}</div><div class="sortbar"><span class="muted" id="result-count"></span><div style="display:flex;align-items:center;gap:7px"><button class="btn outline small mobile-filter" onclick="document.getElementById('filter-panel').classList.toggle('open')">${icon('filter')}Filtr</button><select id="sort" aria-label="Saralash" onchange="changeSort()"><option value="new">Eng yangilari</option><option value="asc">Arzonidan qimmatga</option><option value="desc">Qimmatidan arzonga</option><option value="area">Maydoni kattaroq</option></select><button class="iconbtn ${state.view==='grid'?'active':''}" onclick="setView('grid',this)" aria-label="Katak ko‘rinishi">${icon('grid')}</button><button class="iconbtn ${state.view==='list'?'active':''}" onclick="setView('list',this)" aria-label="Ro‘yxat ko‘rinishi">${icon('list')}</button></div></div><div id="results" class="results ${state.view==='list'?'list':''}"></div><div id="pagination"></div></section></div></div>`}
function filteredListings(f=state.filters){return repository.listings().filter(p=>(!f.q||(p.title+' '+p.id+' '+p.district+' '+p.region).toLowerCase().includes(f.q.toLowerCase()))&&(!f.type||p.type===f.type)&&(!f.deal||p.deal===f.deal)&&(!f.region||f.region==='Barcha hududlar'||p.region===f.region)&&(!f.district||f.district==='Barcha tumanlar'||p.district===f.district)&&(!f.min||p.price>=+f.min)&&(!f.max||p.price<=+f.max)&&(!f.area||p.area>=+f.area)&&(!f.rooms||(+f.rooms===4?p.rooms>=4:p.rooms===+f.rooms))&&(!f.owner||p.tag==='Egasi')&&(!f.verified||p.tag==='Tekshirilgan'))}
function demoDrawResults(){let ps=filteredListings();const sort=document.getElementById('sort')?.value;if(sort==='asc')ps.sort((a,b)=>a.price-b.price);if(sort==='desc')ps.sort((a,b)=>b.price-a.price);if(sort==='area')ps.sort((a,b)=>b.area-a.area);document.getElementById('result-count').textContent=ps.length+' ta e’lon topildi';document.getElementById('results').innerHTML=ps.length?`<div class="grid">${ps.slice((state.page-1)*9,state.page*9).map(card).join('')}</div>`:empty('Mos e’lon topilmadi','Filtrlarni o‘zgartiring yoki barcha e’lonlarni ko‘ring.');document.getElementById('pagination').innerHTML=ps.length>9?`<div class="pagination">${Array.from({length:Math.ceil(ps.length/9)},(_,i)=>`<button class="${state.page===i+1?'active':''}" onclick="state.page=${i+1};drawResults();window.scrollTo({top:160,behavior:'smooth'})">${i+1}</button>`).join('')}</div>`:''}
function applyListingFilters(e){e.preventDefault();const q=new URLSearchParams();for(const [k,v]of new FormData(e.target))if(v&&!['Barcha hududlar','Barcha tumanlar'].includes(v))q.set(k,v);navigate('/listings?'+q)}
function setQuery(k,v){const r=route();v?r.params.set(k,v):r.params.delete(k);navigate(r.path+'?'+r.params)}
function setView(v,b){state.view=v;document.getElementById('results').classList.toggle('list',v==='list');b.parentElement.querySelectorAll('.iconbtn').forEach(x=>x.classList.toggle('active',x===b))}
function saveSearch(){let a=read('savedsearches',[]);a.push({query:location.hash,date:new Date().toISOString(),name:state.filters.q||types[state.filters.type]||'Ko‘chmas mulklar'});write('savedsearches',a);toast('Qidiruv saqlandi. Kabinetdan topishingiz mumkin.')}
function mapMarkup(count=10,selectable=false){return `<div class="map-frame" ${selectable?'id="location-map" onclick="placePin(event)" style="min-height:250px;cursor:crosshair"':''}><svg class="map-art" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="700" fill="#efefe8"/><g fill="#d7e5c9"><path d="M40 30h190v150H40zM700 20h200v160H700zM680 500h270v190H680zM70 390h150v260H70z"/><ellipse cx="570" cy="310" rx="80" ry="100"/></g><g fill="#e3e1da" stroke="#fff" stroke-width="5">${Array.from({length:8},(_,i)=>Array.from({length:6},(_,j)=>`<rect x="${40+i*120}" y="${20+j*115}" width="${70+i%3*8}" height="${65+j%2*10}" rx="7"/>`).join('')).join('')}</g><path d="M200-50Q650 120 390 350T590 750" fill="none" stroke="#b5dce8" stroke-width="22"/><g fill="none" stroke="#fff" stroke-width="15"><path d="M-50 180 1050 380M130-50 700 750M-50 570 1050 120M490-50 280 750M850-50 720 750"/></g><g fill="none" stroke="#f4d496" stroke-width="7"><path d="M-50 180 1050 380M130-50 700 750M-50 570 1050 120"/></g><circle cx="500" cy="345" r="65" fill="#e1edda" stroke="#fff" stroke-width="8"/><circle cx="500" cy="345" r="46" fill="none" stroke="#fff" stroke-width="9"/><g font-family="Arial" font-size="14" fill="#8b8d83"><text x="450" y="345">AMIR TEMUR</text><text x="468" y="366">XIYOBONI</text><text x="770" y="455">MIROBOD</text><text x="150" y="280">CHILONZOR</text><text x="670" y="125">YUNUSOBOD</text><text x="235" y="590">YAKKASAROY</text><text x="120" y="90">OLMAZOR</text></g></svg>${selectable?'<button type="button" class="map-pin" id="chosen-pin" style="left:48%;top:45%">'+icon('pin')+'</button>':repository.listings().slice(0,count).map((p,i)=>`<button class="map-pin" data-map-id="${p.id}" style="left:${12+(i*23)%72}%;top:${13+(i*17)%70}%" onclick="mapSelect(${p.id},this)">${Math.round(p.price/1000000)} mln</button>`).join('')}<div class="map-controls">${selectable?'':`<button class="iconbtn" aria-label="Yaqinlashtirish" onclick="zoomMap(1)">+</button><button class="iconbtn" aria-label="Uzoqlashtirish" onclick="zoomMap(-1)">−</button>`}</div><div class="map-note">e-uylar · Sxematik demo xarita${selectable?' · Joyni belgilash uchun bosing':''}</div></div>`}
function placePin(e){if(e.target.closest('button'))return;let el=e.currentTarget,r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;let pin=document.getElementById('chosen-pin');pin.style.left=x+'%';pin.style.top=y+'%';state.form.mapPosition={x,y};toast('Mulk joylashuvi belgilandi')}
function zoomMap(n){state.mapZoom=Math.max(1,Math.min(1.8,state.mapZoom+n*.2));document.querySelector('.map-art').style.transform=`scale(${state.mapZoom})`;document.querySelectorAll('.map-pin').forEach(el=>{el.style.transform=`scale(${Math.min(state.mapZoom,1.2)})`})}
function mapSelect(id,b){document.querySelectorAll('.map-pin').forEach(x=>x.classList.remove('active'));b.classList.add('active');let p=repository.get(id);document.getElementById('map-side').innerHTML=`<div class="section-head"><strong>Tanlangan e’lon</strong><button onclick="resetMapSide()">Barchasi</button></div>${card(p)}<a class="btn primary small" href="#/property/${p.id}" style="width:100%;margin-top:14px">Batafsil ko‘rish</a>`}
function resetMapSide(){document.getElementById('map-side').innerHTML=filteredListings(Object.fromEntries(route().params)).map(card).join('')||empty('E’lon yo‘q','Filtrni o‘zgartiring.')}
function mapPage(params){return `<div class="container page">${breadcrumb('Xaritada izlash')}<div class="section-head"><div><h1>Yangi manzilingizni xaritadan toping</h1><p class="tiny muted">Demo xarita · belgini tanlab e’lonni ko‘ring</p></div><a class="btn outline" href="#/listings?${params}">${icon('list')} Ro‘yxat</a></div><form class="filter-strip" onsubmit="event.preventDefault();mapFilter(event)">${`<select name="type" aria-label="Mulk turi"><option value="">Barcha mulklar</option>${Object.entries(types).filter(([k])=>k!=='auction').map(([k,v])=>`<option value="${k}" ${params.get('type')===k?'selected':''}>${v}</option>`).join('')}</select>`}<select name="deal" aria-label="Bitim turi"><option value="">Sotuv va ijara</option value="sale">Sotuv</option><option value="rent">Ijara</option></select><select name="region" aria-label="Hudud">${regions.map(r=>`<option ${params.get('region')===r?'selected':''}>${r}</option>`).join('')}</select><button class="btn primary">Yangilash</button></form><div class="map-split"><div class="map-side" id="map-side"></div>${mapMarkup(12)}</div></div>`}

function propertyPage(id){let p=repository.get(id);if(!p)return notFound();return `<div class="container page">${breadcrumb(types[p.type]||'E’lon')}<div class="detail-top"><div><div class="chips" style="margin-bottom:10px"><span class="badge pink">${deals[p.deal]}</span><span class="badge green">${esc(p.tag||'Yangi e’lon')}</span><span class="tiny muted">ID: ${p.id}</span></div><h1>${esc(p.title)}</h1><span class="muted" style="font-size:12px">${icon('pin')} ${esc(p.region)}, ${esc(p.district)}, ${esc(p.address||'Amir Temur ko‘chasi')}</span></div><button class="iconbtn" aria-label="Ulashish" onclick="shareProperty(${p.id})">${icon('share')}</button></div><div class="detail-layout"><div><div class="gallery"><button onclick="openGallery(${p.id},0)"><img src="${photo(p)}" alt="${esc(p.title)}"><span class="gallery-overlay">${icon('photo')} ${p.images?.length||3} ta rasm</span></button><div class="gallery-side">${[1,2].map((n)=>`<button onclick="openGallery(${p.id},${n})"><img src="${p.images?.[n]||PHOTOS[(p.photo+n)%3]}" alt="Mulk ko‘rinishi ${n+1}"></button>`).join('')}</div></div><div class="notice">${icon('photo')} Rasmlar interfeys namunalari. E’lonlar va sotuvchilar demo ma’lumotlaridir.</div><div class="detail-section"><div class="three">${[[p.rooms||'—','Xonalar'],[p.area+' m²','Umumiy maydon'],[p.floor?p.floor+'/'+p.floors:p.land?p.land+' sotix':'—',p.floor?'Qavat':'Yer maydoni']].map(([v,l])=>`<div><div class="price" style="font-size:22px">${v}</div><span class="tiny muted">${l}</span></div>`).join('')}</div></div><div class="detail-section"><h3>Mulk haqida</h3><div class="specs">${[['Mulk turi',types[p.type]],['Bitim turi',deals[p.deal]],['Xonalar',p.rooms||'—'],['Maydon',p.area+' m²'],['Qavat',p.floor?p.floor+'/'+p.floors:'—'],['Ta’mir',p.renovation||'Yevro ta’mir'],['Bino materiali',p.material||'G‘isht'],['Hujjat',p.propertyDocument||p.document||'Kadastr mavjud']].map(([k,v])=>`<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></div><div class="detail-section"><h3>Tavsif</h3><p style="font-size:13px;line-height:1.9;white-space:pre-line">${esc(p.description||'Shinam va yorug‘ ko‘chmas mulk qulay hududda joylashgan. Yaqin atrofda maktab, bolalar bog‘chasi, supermarket va jamoat transporti bekatlari mavjud.\n\nBarcha kommunikatsiyalar ulangan. Hujjatlar tayyor. Mulkni ko‘rish vaqtini egasi bilan oldindan kelishishingiz mumkin.')}</p><div class="chips">${(p.amenities||['Gaz','Elektr','Suv','Internet','Avtoturargoh']).map(a=>`<span class="chip">✓ ${esc(a)}</span>`).join('')}</div></div><div class="detail-section"><h3>Joylashuv</h3><p class="muted tiny">${esc(p.region)}, ${esc(p.district)} · sxematik ko‘rinish</p>${mapMarkup(0,true)}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:20px 0"><span>ID ${p.id} · ${p.date} · ${icon('eye')} 128</span><button onclick="reportProperty(${p.id})">⚑ Shikoyat qilish</button></div></div><aside class="panel seller"><div class="price">${money(p.price)} <span style="font-size:14px">so‘m${p.deal==='rent'?' / oy':''}</span></div><span class="tiny muted">${money(Math.round(p.price/p.area))} so‘m / m²</span><div style="margin:14px 0"><span class="badge green">${p.negotiable?'Narxi kelishiladi':'Mulk egasi bilan bevosita aloqa'}</span></div><button class="btn primary" id="show-phone" onclick="showPhone(${p.id})">${icon('phone')} Telefon raqamini ko‘rish</button><button class="btn outline" onclick="contactSeller(${p.id})">${icon('chat')} Xabar yozish</button><button class="btn soft ${state.favorites.includes(p.id)?'saved':''}" data-heart="${p.id}" onclick="toggleFavorite(${p.id})">${icon('heart')} Sevimlilarga saqlash</button><div class="seller-info"><div class="avatar">${esc(p.seller?.[0]||'E')}</div><div><strong style="font-size:13px">${esc(p.seller||'Mulk egasi')}</strong><small>e-uylar foydalanuvchisi</small><small style="color:var(--green)">● Aloqa uchun ochiq</small></div></div><div class="safe-note">${icon('shield')} Mulkni ko‘rmasdan va hujjatlarni tekshirmasdan oldindan pul o‘tkazmang.</div></aside></div><section class="section"><div class="section-head"><h2>O‘xshash e’lonlar</h2><a href="#/listings?type=${p.type}">Barchasi →</a></div><div class="grid">${repository.listings().filter(x=>x.id!==p.id).slice(0,4).map(card).join('')}</div></section></div>`}
function showPhone(id){let p=repository.get(id);let b=document.getElementById('show-phone');b.outerHTML=`<a href="tel:${esc(p.phone||'+998000000000')}" class="btn primary">${icon('phone')}${esc(p.phone||'+998 00 000 00 00')}</a>`;if(!p.phone)toast('Demo telefon. Haqiqiy raqam backenddan olinadi.')}
async function shareProperty(id){try{await navigator.clipboard.writeText(location.href);toast('E’lon havolasi nusxalandi')}catch{modal(`<h2>E’lonni ulashish</h2><input class="modal-search" readonly value="${esc(location.href)}" onclick="this.select()"><p class="muted" style="margin-top:12px">Havolani belgilang va nusxalang.</p>`)}}
let galleryState={};function openGallery(id,i){galleryState={id,i};drawGallery()}function drawGallery(){let p=repository.get(galleryState.id),imgs=p.images?.length?p.images:[photo(p),PHOTOS[(p.photo+1)%3],PHOTOS[(p.photo+2)%3]];galleryState.i=(galleryState.i+imgs.length)%imgs.length;modal(`<h2>${esc(p.title)}</h2><img class="lightbox" src="${imgs[galleryState.i]}" alt="Mulk rasmi"><div class="lightbox-controls"><button class="btn soft" onclick="galleryState.i--;drawGallery()">←</button><span>${galleryState.i+1} / ${imgs.length}</span><button class="btn soft" onclick="galleryState.i++;drawGallery()">→</button></div>`,true)}
function reportProperty(id){modal(`<h2>E’lon haqida shikoyat</h2><p class="muted">№ ${id} e’lon · sababni belgilang</p><form onsubmit="event.preventDefault();closeModal();toast('Demo shikoyat qabul qilindi')">${selectField('Sabab','reason',['Noto‘g‘ri ma’lumot','Firibgarlik alomatlari','Takroriy e’lon','E’lon dolzarb emas','Boshqa'])}<div class="field"><label for="report-text">Izoh</label><textarea id="report-text" required placeholder="Muammoni tushuntiring"></textarea></div><button class="btn primary full">Shikoyat yuborish</button></form>`)}
function auctions(params){return `<div class="container page">${breadcrumb('Auksion lotlari')}<div class="section-head"><div><div class="eyebrow">Ochiq savdolar</div><h1>Auksion — yangi imkoniyatlar maydoni</h1><p class="muted" style="font-size:13px">Davlat mulki, yer uchastkalari va tijorat obyektlari</p></div><button class="btn outline" onclick="auctionGuide()">${icon('file')} Qanday qatnashiladi?</button></div><div class="notice">${icon('shield')} Auksion bo‘limi — interfeys namunasidir. Arizalar, zakalat va takliflar demo; rasmiy E-auksion tizimi bilan ulanish mavjud emas.</div><form class="filter-strip" id="auction-filters" onsubmit="event.preventDefault();drawLots()"><input name="q" placeholder="Lot raqami yoki mulk nomi" aria-label="Lot qidirish"><select name="region" aria-label="Viloyat"><option value="">Barcha viloyatlar</option>${regions.slice(1).map(r=>`<option>${r}</option>`).join('')}</select><select name="kind" aria-label="Lot turi"><option value="">Obyekt turi</option><option>Yer uchastkasi</option><option>Davlat mulki</option><option>Bank mulki</option><option>Qishloq xo‘jaligi yeri</option></select><button class="btn primary">${icon('filter')} Izlash</button><button class="btn outline" type="reset" onclick="setTimeout(drawLots,0)">Tozalash</button></form><div class="sortbar"><div class="chips" id="lot-tabs">${[['all','Barcha lotlar'],['new','Yangi lotlar'],['live','● Joriy savdolar'],['ended','Yakunlanganlar']].map(([v,l],i)=>`<button class="chip ${i===0?'active':''}" data-stage="${v}" onclick="document.querySelectorAll('#lot-tabs .chip').forEach(b=>b.classList.remove('active'));this.classList.add('active');drawLots()">${l}</button>`).join('')}</div><span class="tiny muted" id="lot-count"></span></div><div class="auction-grid" id="lots-results"></div></div>`}
function drawLots(){let f=Object.fromEntries(new FormData(document.getElementById('auction-filters'))),stage=document.querySelector('#lot-tabs .active').dataset.stage;let ls=lots.filter(l=>(!f.q||(l.title+' '+l.id).toLowerCase().includes(f.q.toLowerCase()))&&(!f.region||l.region===f.region)&&(!f.kind||l.kind===f.kind)&&(stage==='all'||l.stage===stage));document.getElementById('lot-count').textContent=ls.length+' ta lot';document.getElementById('lots-results').innerHTML=ls.map(lotCard).join('')||empty('Lot topilmadi','Boshqa filtrlarni tanlang.','/auctions','Barchasini ko‘rish')}
function auctionGuide(){modal(`<h2>Auksionda ishtirok etish</h2><p class="muted">Qatnashish jarayonining interfeys namunasi</p>${[['1','Lotni tanlang','Obyekt tavsifi, hujjatlari, savdo shartlari va sanasini o‘rganing.'],['2','Ariza tayyorlang','Shaxsiy ma’lumotlar va roziliklarni kiriting.'],['3','Zakalat pulini kiriting','Haqiqiy xizmatda to‘lov tasdiqlanishi talab qilinadi. Bu prototip to‘lov olmaydi.'],['4','Savdoda qatnashing','Taklif yuboring va savdo natijasini kuzating.']].map(([n,t,d])=>`<div style="margin:20px 0;display:flex;gap:12px"><span class="step-index">${n}</span><div><strong>${t}</strong><p class="muted" style="margin:5px 0">${d}</p></div></div>`).join('')}<button class="btn primary full" onclick="closeModal()">Tushunarli</button>`)}
function auctionDetail(id){let l=lots.find(x=>x.id===+id);if(!l)return notFound();let app=state.applications.find(x=>x.id===l.id),ended=l.stage==='ended';return `<div class="container page">${breadcrumb('Auksion / Lot № '+l.id)}<div class="detail-top"><div><span class="badge ${l.stage==='live'?'pink':'blue'}">${l.stage==='live'?'● Joriy savdo':ended?'Yakunlangan':'Yangi lot'} · № ${l.id}</span><h1 style="margin-top:12px">${l.title}</h1><span class="muted tiny">${icon('pin')} ${l.region}, ${l.district}</span></div><button class="iconbtn" onclick="shareProperty(${l.id})" aria-label="Ulashish">${icon('share')}</button></div><div class="detail-layout"><div><img src="${PHOTOS[l.photo]}" alt="${l.title}" style="width:100%;height:360px;object-fit:cover;border-radius:15px"><div class="detail-section"><h3>Lot haqida ma’lumot</h3><div class="specs">${[['Lot raqami','№ '+l.id],['Obyekt turi',l.kind],['Umumiy maydon',l.area+' m²'],['Hudud',l.region],['Tuman',l.district],['Savdo usuli','Elektron ochiq auksion'],['Zakalat','20%'],['Holati',ended?'Yakunlangan':'Savdoga chiqarilgan']].map(([k,v])=>`<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></div><div class="detail-section"><h3>Tavsif va savdo shartlari</h3><p style="font-size:13px;line-height:1.9">Obyekt bo‘yicha boshlang‘ich narx, foydalanish maqsadi va savdo sanasi lot kartasida ko‘rsatilgan. Ishtirokchi savdo shartlarini o‘rganishi, hujjatlar bilan tanishishi va belgilangan muddatgacha ariza taqdim etishi kerak.</p><div class="notice">Bu demo lot. Huquqiy va kadastr ma’lumotlari namunaviy; haqiqiy davlat savdosi hisoblanmaydi.</div></div><div class="detail-section"><h3>Hujjatlar</h3>${['Obyekt haqida ma’lumot','Savdo shartlari','Kadastr ma’lumotnomasi'].map((t,i)=>`<button class="btn outline" style="display:flex;width:100%;justify-content:space-between;margin:9px 0" onclick="lotDocument(${l.id},${i})">${icon('file')} ${t} <span class="badge">Ko‘rish →</span></button>`).join('')}</div><div class="detail-section"><h3>Joylashuv</h3>${mapMarkup(0)}</div></div><aside class="panel seller"><span class="tiny muted">Boshlang‘ich narx</span><div class="price" style="margin-top:7px">${money(l.price)} <span style="font-size:13px">so‘m</span></div><div class="info-pair"><span class="muted">Zakalat (20%)</span><strong>${money(l.deposit)} so‘m</strong></div><div class="info-pair"><span class="muted">Savdo qadami (5%)</span><strong>${money(l.price*.05)} so‘m</strong></div><div class="panel" style="background:var(--tint);border:0;padding:15px;margin:20px 0"><div class="tiny" style="color:var(--pink)">${ended?'Savdo yakunlandi':'Savdo boshlanishi'}</div><strong style="font-size:17px">${new Date(l.date).toLocaleDateString('uz-UZ',{timeZone:'Asia/Tashkent'})}</strong><div class="tiny muted">Toshkent vaqti bilan ${new Date(l.date).toLocaleTimeString('uz-UZ',{timeZone:'Asia/Tashkent',hour:'2-digit',minute:'2-digit'})}</div></div>${ended?'<div class="badge">Arizalar qabuli yopilgan</div>':app?`<div class="badge green">✓ Demo ariza saqlangan</div><a href="#/applications" class="btn outline">Arizalarimni ko‘rish</a>`:`<button class="btn primary" onclick="applyLot(${l.id})">Ariza berish ${icon('arrow')}</button>`}<button class="btn soft" onclick="auctionGuide()">Qatnashish tartibi</button><div class="safe-note">${icon('shield')} Demo rejim. To‘lovlar amalga oshirilmaydi va rasmiy ariza yuborilmaydi.</div></aside></div></div>`}
function demoLotDocument(id,i){let l=lots.find(x=>x.id===id),t=['Obyekt haqida ma’lumot','Savdo shartlari','Kadastr ma’lumotnomasi'][i];modal(`<h2>${t}</h2><span class="badge orange">Namunaviy hujjat</span><p style="margin-top:18px">Lot: ${id}<br>Obyekt: ${l.title}<br>Maydon: ${l.area} m²<br>Manzil: ${l.region}, ${l.district}</p><p class="muted">Bu prototipdagi ko‘rinish. Haqiqiy fayl backenddan yuklanadi; ushbu ma’lumot huquqiy hujjat hisoblanmaydi.</p><button class="btn primary full" onclick="closeModal()">Yopish</button>`)}
function applyLot(id){if(!state.user){openLogin(()=>applyLot(id));return}let l=lots.find(x=>x.id===id);modal(`<h2>Auksionga demo ariza</h2><p class="muted">Lot № ${id} · ${l.title}</p><form onsubmit="submitLot(event,${id})">${field('F.I.Sh.','fullname','To‘liq ismingiz','text',state.user.name,true)}${field('Telefon raqami','lotphone','+998 90 123 45 67','tel',state.user.phone,true)}<div class="panel" style="padding:15px;margin-bottom:18px;background:var(--bg)"><div class="info-pair"><span>Zakalat puli</span><strong>${money(l.deposit)} so‘m</strong></div><span class="badge orange">Demo — to‘lov talab qilinmaydi</span></div><label class="check" style="margin-bottom:20px"><input type="checkbox" required> Savdo shartlari bilan tanishdim. Bu demo ariza ekanini tushunaman.</label><button class="btn primary full">Demo arizani saqlash</button></form>`)}
function demoSubmitLot(e,id){e.preventDefault();state.applications.push({id,name:new FormData(e.target).get('fullname'),date:new Date().toISOString(),status:'demo'});write('applications',state.applications);closeModal();render();toast('Demo ariza saqlandi. Rasmiy ariza yuborilmadi.')}
function projectsPage(){return `<div class="container page">${breadcrumb('Yangi uylar')}<section class="promo" style="margin-top:0;min-height:200px;background:#ecf1e4"><div><div class="eyebrow">Quruvchidan to‘g‘ridan-to‘g‘ri</div><h1>Kelajagingiz uchun yangi manzil.</h1><p>Toshkentdagi zamonaviy turar joy majmualarini kashf eting.</p><div class="chips" style="margin-top:20px"><span class="badge green">✓ Bo‘lib to‘lash</span><span class="badge green">✓ Yangi infratuzilma</span><span class="badge green">✓ Quruvchidan</span></div></div><span class="promo-art" style="right:30px;top:10px">${icon('building')}</span></section><form class="filter-strip" onsubmit="event.preventDefault();drawProjects(event)"><select name="district" aria-label="Tuman"><option value="">Barcha tumanlar</option>Olmazor</option>Mirzo Ulug‘bek</option>Mirobod</select><select name="rooms" aria-label="Xona"><option value="">Xonalar soni</option value="1">1 xona</option><option value="2">2 xona</option><option value="3">3 xona</option><option value="4">4 xona</option></select><select name="end" aria-label="Topshirish muddati"><option value="">Topshirish muddati</option value="I">2027 I chorak</option value="III">2027 III chorak</option value="IV">2027 IV chorak</option></select><button class="btn primary">Majmualarni topish</button><a href="#/map?type=new" class="btn outline">${icon('map')} Xaritada</a></form><div class="section-head"><h2>Turar joy majmualari</h2><span class="muted tiny" id="project-count">3 ta majmua</span></div><div class="project-grid" id="project-results">${projects.map(projectCard).join('')}</div></div>`}
function drawProjects(e){let f=Object.fromEntries(new FormData(e.target)),ps=projects.filter(p=>(!f.district||p.district===f.district)&&(!f.rooms||(+f.rooms>=+p.rooms[0]&&+f.rooms<=+p.rooms.at(-1)))&&(!f.end||p.end.includes(', '+f.end+' chorak')));document.getElementById('project-count').textContent=ps.length+' ta majmua';document.getElementById('project-results').innerHTML=ps.map(projectCard).join('')||empty('Mos majmua topilmadi','Filtrlarni o‘zgartiring.','/projects','Barcha majmualar')}
function projectDetail(id){let p=projects.find(x=>x.id===+id);if(!p)return notFound();return `<div class="container page">${breadcrumb('Yangi uylar / '+p.name)}<div class="detail-layout"><div><span class="badge green">Quruvchidan</span><h1 style="margin-top:13px">${p.name} — hayot uchun yaratilgan</h1><p class="muted">Toshkent, ${p.district} tumani · ${p.company}</p><img src="${PHOTOS[p.photo]}" alt="${p.name}" style="width:100%;height:430px;object-fit:cover;border-radius:16px"><div class="detail-section"><h3>Majmua haqida</h3><p style="font-size:13px;line-height:1.9">Zamonaviy arxitektura va kundalik hayot uchun o‘ylangan qulayliklar. Yopiq hovli, yashil maydonlar, bolalar maydonchasi va qulay infratuzilma bir manzilda.</p><div class="chips">${['Yopiq hovli','Avtoturargoh','Bolalar maydoni','Lift','24/7 qo‘riqlash'].map(t=>`<span class="chip">✓ ${t}</span>`).join('')}</div></div><div class="detail-section"><h3>Kvartiralar va rejalashtirish</h3><div class="table-wrap"><table><thead><tr><th>Xonalar</th><th>Maydon</th><th>Narx</th><th></th></tr></thead><tbody>${[1,2,3,4].filter(n=>n>=+p.rooms[0]&&n<=+p.rooms.at(-1)).map((n,i)=>`<tr><td>${n} xonali</td><td>${35+n*12} m²</td><td>${money(450000000+n*190000000)} so‘mdan</td><td><button class="btn outline small" onclick="floorPlan(${n})">Reja</button></td></tr>`).join('')}</tbody></table></div></div><div class="detail-section"><h3>Qurilish jarayoni</h3><div class="info-pair"><span class="muted">Bajarilgan ishlar (namuna)</span><strong>${p.percent}%</strong></div><div style="height:8px;background:#f1e6ef;border-radius:9px"><div style="height:100%;background:var(--pink);width:${p.percent}%;border-radius:9px"></div></div><p class="tiny muted" style="margin-top:12px">Topshirish: ${p.end}</p></div><div class="detail-section"><h3>Joylashuv</h3>${mapMarkup(0)}</div></div><aside class="panel seller"><span class="tiny muted">Kvartiralar narxi</span><div class="price" style="margin:9px 0">${p.price} <span style="font-size:14px">so‘mdan</span></div><div class="info-pair"><span class="muted">Maydon</span><strong>${p.area} m²</strong></div><div class="info-pair"><span class="muted">Xonalar</span><strong>${p.rooms}</strong></div><div class="info-pair"><span class="muted">Topshirish</span><strong>${p.end}</strong></div><span class="badge green">Bo‘lib to‘lash imkoniyati</span><button class="btn primary" onclick="callbackRequest('${p.name}')">${icon('phone')} Bog‘lanish</button><button class="btn outline" onclick="contactSeller(${p.id})">${icon('chat')} Maslahat olish</button><div class="seller-info"><div class="avatar">${p.company[0]}</div><div><strong>${p.company}</strong><small>Qurilish kompaniyasi · demo</small></div></div></aside></div></div>`}

on class="form-block" id="post-category"><h3><span class="step-index">3</span>Kategoriya va bitim</h3><p>Qanday mulk taklif qilmoqchisiz?</p><div class="two">${selectField('Mulk turi','type',[['','Tanlang'],...Object.entries(types).filter(([k])=>k!=='auction')],d.type||'',true)}${selectField('Bitim turi','deal',[['sale','Sotuv'],['rent','Ijara'],['auction','Auksionga taklif']],d.deal||'sale',true)}</div><div class="notice" id="auction-post-note" style="display:${d.deal==='auction'?'flex':'none'}">${icon('hammer')} Auksion takliflari admin tekshiruvidan o‘tadi. Oddiy e’lon rasmiy auksion lotini avtomatik yaratmaydi.</div></section><section class="form-block" id="post-features"><h3><span class="step-index">4</span>Mulk xususiyatlari</h3><p>Aniq ma’lumot e’loningizga ishonchni oshiradi.</p><div class="three">${field('Umumiy maydon, m²','area','Masalan, 82','number',d.area||'',true)}${field('Xonalar soni','rooms','3','number',d.rooms||'')}${field('Yer maydoni, sotix','land','6','number',d.land||'')}${field('Qavat','floor','5','number',d.floor||'')}${field('Bino qavatlari','floors','9','number',d.floors||'')}${field('Qurilgan yil','year','2024','number',d.year||'')}</div><div class="two">${selectField('Ta’mir holati','renovation',['Tanlang','Yevro ta’mir','Yaxshi','O‘rtacha','Ta’mirsiz','Qora suvoq'],d.renovation)}${selectField('Bino materiali','material',['Tanlang','G‘isht','Monolit','Panel','Boshqa'],d.material)}${selectField('Hujjatlar','propertyDocument',['Kadastr mavjud','Hujjatlar tayyorlanmoqda','Ijara huquqi'],d.propertyDocument||d.document)}${selectField('E’lon beruvchi','ownerType',['Mulk egasi','Vositachi','Quruvchi','Tashkilot'],d.ownerType)}</div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:12px">Qulayliklar</label><div class="three">${['Gaz','Elektr','Suv','Kanalizatsiya','Internet','Isitish','Lift','Avtoturargoh','Balkon','Mebel','Konditsioner','Qo‘riqlash'].map(a=>`<label class="check"><input type="checkbox" name="amenities" va -top:18px">${field('Manzil','address','Ko‘cha, uy raqami','text',d.address||'',true)}${field('Mo‘ljal','landmark','Masalan, Yunusobod metro bekati','text',d.landmark||'')}</div><label class="check"><input name="hideAddress" type="checkbox" ${d.hideAddress?'checked':''}> E’londa faqat taxminiy joylashuvni ko‘rsatish</label></section><section class="form-block" id="post-contact"><h3><span class="step-index">8</span>Aloqa ma’lumotlari</h3><p>Xaridorlar siz bilan qanday bog‘lanishi mumkin?</p><div class="two">${field('Ismingiz','seller','Ism va familiya','text',d.seller||state.user?.name||'',true)}${field('Telefon raqami','phone','+998 90 123 45 67','tel',d.phone||state.user?.phone||'',true)}</div><div class="two">${field('Qo‘shimcha telefon','extraPhone','+998','tel',d.extraPhone||'')}${field('Telegram (ixtiyoriy)','telegram','@username','text',d.telegram||'')}</div><div class="two"><label class="check"><input type="checkbox" name="allowCalls" ${d.allowCalls!==false?'checked':''}> Qo‘ng‘iroqlar</label><label class="check"><input type="checkbox" name="allowChat" ${d.allowChat!==false?'checked':''}> Sayt orqali xabarlar</label></div></section><section class="form-block" id="post-publish"><h3><span class="step-index">9</span>Tekshirish va joylash</h3><p>E’lon tekshiruvga yuboriladi. Holatini shaxsiy kabinetda kuzating.</p><label class="check" style="margin-bottom:15px"><input type="checkbox" name="consent" required> <span><a href="#/terms" style="color:var(--pink)">Foydalanish shartlari</a> va <a href="#/privacy" style="color:var(--pink)">maxfiylik siyosati</a>ga roziman.</span></label><label class="check" style="margin-bottom:22px"><input type="checkbox" name="accurate" required> Kiritilgan ma’lumotlarning to‘g‘riligini tasdiqlayman.</label><div id="post-error" class="inline-error" role="alert"></div><div class="form-actions"><button type="button" class="btn outline" onclick="saveDraft()">Qoralama saqlash</button><button type="button" class="btn soft" onclick="previewPost()">${icon('eye')}Ko‘rib chiqish</button><button class="btn primary">${icon('check')}${edit?'O‘zgarishlarni saqlash':'Tekshiruvga yuborish'}</button></div></section></form><aside class="panel form-toc"><strong>E’loningiz tarkibi</strong><div style="height:4px;background:#eee;border-radius:4px;margin:16px 0 6px"><div id="post-progress" style="width:0;background:var(--pink);height:100%;border-radius:4px"></div></div>${postSections.map(([id,t])=>`<a href="#post-${id}" onclick="event.preventDefault();document.getElementById('post-${id}').scrollIntoView({behavior:'smooth'})"><span></span>${t}</a>`).join('')}<div class="safe-note" style="display:block">${icon('shield')}<p style="margin:8px 0 0">To‘liq va sifatli e’lon tezroq e’tibor tortadi.</p></div></aside></div></div></div>`}
function syncForm(){const f=document.getElementById('post-form');if(!f)return;const d=Object.fromEntries(new FormData(f));d.amenities=new FormData(f).getAll('amenities');['negotiable','installment','hideAddress','allowCalls','allowChat'].forEach(k=>d[k]=f.elements[k].checked);state.form={...state.form,...d};let done=['title','type','area','price','description','district','address','seller','phone'].filter(k=>d[k]).length;document.getElementById('post-progress').style.width=(done/9*100)+'%';document.getElementById('auction-post-note').style.display=d.deal==='auction'?'flex':'none'}
function saveDraft(){syncForm();write('draft',{...state.form,draftImages:state.uploads});toast('Qoralama ushbu brauzerda saqlandi')}
async function uploadPhotos(files){let err=[];for(let file of Array.from(files)){if(state.uploads.length>=10){err.push('Ko‘pi bilan 10 ta rasm');break}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){err.push('JPG, PNG yoki WEBP tanlang');continue}if(file.size>5*1024*1024){err.push('Har bir rasm 5 MB gacha bo‘lsin');continue}let data=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});let compressed=await new Promise(resolve=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1000/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.75))};im.onerror=()=>resolve(null);im.src=data});if(compressed)state.uploads.push(compressed)}drawPhotoPreviews();if(err.length)toast([...new Set(err)].join('. '))}
function drawPhotoPreviews(){let e=document.getElementById('photo-previews');if(e)e.innerHTML=state.uploads.map((src,i)=>`<div class="preview-img"><img src="${src}" alt="Yuklangan rasm ${i+1}"><button type="button" aria-label="Rasmni o‘chirish" onclick="state.uploads.splice(${i},1);drawPhotoPreviews()">×</button>${i===0?'<span class="badge pink" style="display:block;font-size:8px">Muqova</span>':''}</div>`).join('')}
function previewPost(){syncForm();const d=state.form;modal(`<h2>E’lonni ko‘rib chiqish</h2><img src="${state.uploads[0]||PHOTOS[0]}" alt="Muqova" style="width:100%;height:220px;object-fit:cover;border-radius:12px"><h3 style="margin-top:17px">${esc(d.title||'E’lon nomi kiritilmagan')}</h3><div class="price">${money(+d.price||0)} so‘m${d.deal==='rent'?' / oy':''}</div><p class="muted">${esc(d.region)} · ${esc(d.district)} · ${esc(d.area)} m²</p><p style="white-space:pre-line">${esc(d.description||'Tavsif kiritilmagan')}</p><p class="muted tiny">${state.uploads.length?'':'Muqova namunaviy. ' }Joylashdan oldin barcha majburiy maydonlarni to‘ldiring.</p><button class="btn primary full" onclick="closeModal()">Tahrirlashga qaytish</button>`)}
function demoPublishPost(e){e.preventDefault();syncForm();const d=state.form;let err='';if(!state.uploads.length)err='Kamida bitta rasm qo‘shing.';else if(+d.price<=0||+d.area<=0)err='Narx va umumiy maydon noldan katta bo‘lishi kerak.';else if(d.floor&&d.floors&&+d.floor>+d.floors)err='Qavat bino qavatlari sonidan katta bo‘lishi mumkin emas.';else if(!/^\+?998[\s\d()-]{9,17}$/.test(d.phone)||d.phone.replace(/\D/g,'').length!==12)err='Telefon raqamini +998 XX XXX XX XX shaklida kiriting.';if(err){document.getElementById('post-error').textContent=err;document.getElementById('post-error').scrollIntoView({behavior:'smooth',block:'center'});return}if(!state.user){openLogin(()=>publishPost({preventDefault(){}}));return}const editing=+d.editId||null,id=editing||Date.now();const p={...d,id,price:+d.price,area:+d.area,rooms:+d.rooms,land:+d.land,floor:+d.floor,floors:+d.floors,images:state.uploads,image:state.uploads[0],photo:0,tag:d.ownerType==='Mulk egasi'?'Egasi':'Yangi',date:'Hozirgina',status:'pending',user:state.user.phone};state.own=editing?state.own.map(x=>x.id===editing?p:x):[p,...state.own];delete state.moderation[id];if(!write('own',state.own)){document.getElementById('post-error').textContent='Saqlash uchun joy yetarli emas. Rasmlar sonini kamaytiring.';return}write('moderation',state.moderation);write('draft',{});state.form={};state.uploads=[];navigate('/success?kind=post')}
function successPage(){return `<div class="container page"><div class="success"><div class="success-icon">${icon('check')}</div><div class="eyebrow">Yana bir qadam tashlandi</div><h1>E’loningiz tekshiruvga yuborildi!</h1><p class="muted" style="max-width:470px;margin:0 auto 25px">Demo e’lon ushbu brauzerda saqlandi. Holatini shaxsiy kabinetda kuzating yoki demo admin paneldan tasdiqlang.</p><div class="chips" style="justify-content:center"><a href="#/my-listings" class="btn primary">E’lonlarimga o‘tish</a><a href="#/admin" class="btn outline">Demo admin panel</a></div></div></div>`}

let loginCallback=null;function openLogin(callback=null){loginCallback=callback;modal(`<h2>Kirish yoki ro‘yxatdan o‘tish</h2><p class="muted">E’lonlar, xabarlar va sevimlilaringiz — bir joyda.</p><span class="badge orange" style="margin-bottom:20px">Demo kirish · SMS yuborilmaydi</span><form onsubmit="loginStep(event)">${field('Telefon raqami','login-phone','+998 90 123 45 67','tel',state.form.phone||'',true)}<div id="login-error" class="inline-error"></div><button class="btn primary full" style="margin-top:10px">Davom etish ${icon('arrow')}</button></form><p class="tiny muted" style="margin:18px 0 0">Davom etish orqali <a style="color:var(--pink)" href="#/terms" onclick="closeModal()">foydalanish shartlari</a>ni qabul qilasiz.</p>`)}

function logout(){state.user=null;write('user',null);updateHeader();navigate('/');toast('Kabinetdan chiqdingiz')}
function sideMenu(active){return `<aside class="panel side-menu"><div class="profile-mini"><div class="avatar">${esc(state.user?.name?.[0]||'J')}</div><strong>${esc(state.user?.name||'Demo foydalanuvchi')}</strong><div class="tiny muted" style="margin-top:5px">${esc(state.user?.phone||'Demo kabinet')}</div></div><nav>${[['my-listings','list','E’lonlarim'],['favorites','heart','Sevimlilar'],['messages','chat','Xabarlar'],['applications','hammer','Auksion arizalarim'],['saved-searches','filter','Qidiruvlarim'],['profile','settings','Sozlamalar']].map(([p,i,t])=>`<a href="#/${p}" class="${active===p?'active':''}">${icon(i)}${t}</a>`).join('')}<a href="#/admin">${icon('shield')}Demo admin panel</a>${state.user?`<a href="javascript:void(0)" onclick="logout()">${icon('logout')}Chiqish</a>`:`<button class="btn primary small" onclick="openLogin()" style="width:100%">Kirish</button>`}</nav></aside>`}
function accountLayout(active,title,body){return `<div class="container page">${breadcrumb('Shaxsiy kabinet')}<div class="dashboard">${sideMenu(active)}<section><div class="section-head"><h1 style="margin-bottom:0">${title}</h1>${active==='my-listings'?'<a class="btn primary small" href="#/post">+ E’lon joylash</a>':''}</div>${!state.user&&active!=='favorites'?'<div class="notice">Demo kabinetni ko‘ryapsiz. Ma’lumotlarni saqlash uchun demo kirishdan foydalaning.</div>':''}${body}</section></div></div>`}
function favoritesPage(){let ps=state.favorites.map(id=>repository.get(id)).filter(Boolean);return accountLayout('favorites','Sevimli e’lonlar',`<p class="muted tiny">Sizga yoqqan manzillar — bir joyda. ${ps.length} ta e’lon.</p>${ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:empty('Hali sevimli e’lon yo‘q','Sizga yoqqan manzil kartasidagi yurakchani bosing.')}`)}
function myListingsPage(){let own=state.own.filter(p=>!state.user||p.user===state.user.phone);return accountLayout('my-listings','Mening e’lonlarim',`<div class="stats">${[[own.length,'Jami e’lonlar'],[own.filter(p=>(state.moderation[p.id]||p.status)==='active').length,'Faol e’lonlar'],[own.filter(p=>(state.moderation[p.id]||p.status)==='pending').length,'Tekshiruvda'],[own.filter(p=>(state.moderation[p.id]||p.status)==='rejected').length,'Rad etilgan']].map(([n,t])=>`<div class="stat"><small>${t}</small><strong>${n}</strong><span>Ushbu brauzerdagi demo</span></div>`).join('')}</div>${own.length?`<div class="table-wrap"><table><thead><tr><th>E’lon</th><th>Narx</th><th>Holat</th><th>Amallar</th></tr></thead><tbody>${own.map(p=>`<tr><td><div class="table-property"><img src="${photo(p)}" alt=""><a href="#/property/${p.id}">${esc(p.title)}<small>№ ${p.id}</small></a></div></td><td>${money(p.price)} so‘m</td><td>${statusBadge(state.moderation[p.id]||p.status)}</td><td><a class="iconbtn" aria-label="Tahrirlash" href="#/edit/${p.id}">${icon('edit')}</a> <button class="iconbtn" aria-label="O‘chirish" onclick="deleteOwn(${p.id})">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('Birinchi e’loningizni joylang','Uy, yer yoki tijorat mulkingizni taklif qiling.','/post','+ E’lon joylash')}`)}
function statusBadge(s){return `<span class="badge ${s==='active'?'green':s==='pending'?'orange':s==='rejected'?'pink':''}">${({active:'Faol',pending:'Tekshiruvda',rejected:'Rad etilgan',archived:'Arxivda'})[s]||s}</span>`}
function deleteOwn(id){modal(`<h2>E’lon o‘chirilsinmi?</h2><p class="muted">Demo e’lon ushbu brauzerdagi ro‘yxatdan olib tashlanadi.</p><div class="two"><button class="btn soft" onclick="closeModal()">Bekor qilish</button><button class="btn primary" onclick="state.own=state.own.filter(x=>x.id!==${id});write('own',state.own);closeModal();render();toast('E’lon o‘chirildi')">O‘chirish</button></div>`)}
function savedSearchesPage(){let ss=read('savedsearches',[]);return accountLayout('saved-searches','Saqlangan qidiruvlar',ss.length?ss.map((s,i)=>`<div class="panel" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between"><div><strong>${esc(s.name)}</strong><p class="tiny muted" style="margin:5px 0 0">${new Date(s.date).toLocaleDateString('uz-UZ')}</p></div><div><a class="btn primary small" href="${esc(s.query)}">Natijalar</a> <button class="iconbtn" aria-label="O‘chirish" onclick="removeSavedSearch(${i})">${icon('trash')}</button></div></div>`).join(''):empty('Saqlangan qidiruvlar yo‘q','E’lonlar filtridagi “Qidiruvni saqlash” tugmasidan foydalaning.'))}
function removeSavedSearch(i){let ss=read('savedsearches',[]);ss.splice(i,1);write('savedsearches',ss);render()}
function demoApplicationsPage(){return accountLayout('applications','Auksion arizalarim',state.applications.length?`<div class="table-wrap"><table><thead><tr><th>Lot</th><th>Obyekt</th><th>Sana</th><th>Holat</th><th></th></tr></thead><tbody>${state.applications.map(a=>{let l=lots.find(l=>l.id===a.id);return `<tr><td>№ ${a.id}</td><td>${l.title}</td><td>${new Date(a.date).toLocaleDateString('uz-UZ')}</td><td><span class="badge orange">Demo ariza</span></td><td><a class="btn outline small" href="#/auction/${a.id}">Ko‘rish</a></td></tr>`}).join('')}</tbody></table></div><div class="notice">Bu demo arizalar. Haqiqiy savdoda ishtirok etish huquqini bermaydi.</div>`:empty('Hali ariza bermagansiz','Qiziqarli lotlarni tanlang va savdo shartlarini o‘rganing.','/auctions','Auksionlarni ko‘rish'))}
function profilePage(){return accountLayout('profile','Profil sozlamalari',`<div class="panel" style="max-width:650px"><div class="seller-info" style="border:0;margin:0 0 22px;padding:0"><div class="avatar" style="width:60px;height:60px;font-size:22px">${esc(state.user?.name?.[0]||'E')}</div><div><h3 style="margin:0">Shaxsiy ma’lumotlar</h3><span class="tiny muted">Demo profil</span></div></div><form onsubmit="saveProfile(event)">${field('Ism va familiya','profile-name','Ismingiz','text',state.user?.name||'',true)}${field('Telefon','profile-phone','+998 90 123 45 67','tel',state.user?.phone||'',true)}${field('Elektron pochta','profile-email','email@example.com','email',read('profile',{}).email||'')}${selectField('Hudud','profile-region',regions,state.region)}<h3 style="margin-top:25px">Bildirishnomalar</h3><label class="check" style="margin:15px 0"><input name="notify-messages" type="checkbox" ${read('profile',{}).messages!==false?'checked':''}> Yangi xabarlar haqida bildirish</label><label class="check" style="margin:15px 0 25px"><input name="notify-auctions" type="checkbox" ${read('profile',{}).auctions!==false?'checked':''}> Auksionlar haqida bildirish</label><p class="tiny muted">Bildirishnomalar sozlamalari demo sifatida saqlanadi.</p><button class="btn primary">O‘zgarishlarni saqlash</button></form></div>`)}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target),phone=f.get('profile-phone');if(phone.replace(/\D/g,'').length!==12||!phone.replace(/\D/g,'').startsWith('998')){toast('Telefonni +998 XX XXX XX XX shaklida kiriting');return}state.user={name:f.get('profile-name'),phone};state.region=f.get('profile-region');write('user',state.user);write('region',state.region);write('profile',{email:f.get('profile-email'),messages:f.has('notify-messages'),auctions:f.has('notify-auctions')});updateHeader();toast('Demo profil saqlandi')}
function contactSeller(id){if(!state.user){openLogin(()=>contactSeller(id));return}let p=repository.get(id);state.chatId='seller'+id;if(!state.chat[state.chatId]){state.chat[state.chatId]={name:p.seller,title:p.title,messages:[{mine:false,text:'Assalomu alaykum! E’lon bo‘yicha qanday savolingiz bor?',time:'12:40'}]};write('chat',state.chat)}navigate('/messages')}
function demoEnsureChats(){if(!Object.keys(state.chat).length)state.chat={aziza:{name:'Aziza Karimova',title:'Yorug‘ va shinam 3 xonali kvartira',messages:[{mine:false,text:'Assalomu alaykum! Kvartira hali sotuvda. Qachon ko‘rmoqchisiz?',time:'12:45'}]},dilshod:{name:'Dilshod Rahimov',title:'Shahar markazida 2 xonali ijara',messages:[{mine:false,text:'Assalomu alaykum! Ijara shartlari bo‘yicha savollaringizni yozing.',time:'11:30'}]}};if(!state.chat[state.chatId])state.chatId=Object.keys(state.chat)[0]}
function demoMessagesPage(){ensureChats();return accountLayout('messages','Xabarlar',`<p class="tiny muted">Demo suhbatlar: xabarlar faqat ushbu brauzerda saqlanadi, sotuvchilarga yuborilmaydi.</p><div class="messages"><div class="conversation-list"><h3>Suhbatlar</h3>${Object.entries(state.chat).map(([id,c])=>`<button class="conversation ${id===state.chatId?'active':''}" onclick="state.chatId='${id}';render()"><span class="avatar">${esc(c.name[0])}</span><span><strong style="font-size:12px">${esc(c.name)}</strong><small>${esc(c.messages.at(-1).text.slice(0,36))}…</small></span></button>`).join('')}</div><div class="chat" id="chat-content"></div></div>`)}
function drawChat(){let c=state.chat[state.chatId];document.getElementById('chat-content').innerHTML=`<div class="chat-title"><div class="avatar">${esc(c.name[0])}</div><div><strong>${esc(c.name)}</strong><div class="tiny muted">${esc(c.title)}</div></div><span class="badge green" style="margin-left:auto">Demo</span></div><div class="chat-messages" id="chat-messages"><div class="tiny muted" style="text-align:center">Bugun · Demo suhbat</div>${c.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${m.time} ${m.mine?'✓✓':''}</small></div>`).join('')}</div><form class="chat-input" onsubmit="sendChat(event)"><input name="text" aria-label="Xabar matni" placeholder="Xabaringizni yozing..." maxlength="2000" required><button class="btn primary" aria-label="Demo xabarni saqlash">${icon('arrow')}</button></form>`;let el=document.getElementById('chat-messages');el.scrollTop=el.scrollHeight}
function sendChat(e){e.preventDefault();let text=new FormData(e.target).get('text').trim();if(!text)return;state.chat[state.chatId].messages.push({mine:true,text,time:new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})});write('chat',state.chat);drawChat()}
let adminTab='overview';
function adminPage(){let all=[...state.own,...base],pending=all.filter(p=>(state.moderation[p.id]||p.status)==='pending');return `<div class="form-bg"><div class="container page">${breadcrumb('Admin panel')}<div class="section-head"><div><div class="eyebrow">Boshqaruv markazi</div><h1>Admin panel</h1><p class="tiny muted">Demo boshqaruv · kirish himoyasi backendda qo‘shiladi</p></div><a class="btn primary" href="#/post">${icon('plus')}E’lon qo‘shish</a></div><div class="dashboard"><aside class="panel side-menu"><nav>${[['overview','chart','Umumiy ko‘rinish'],['moderation','shield','Moderatsiya ('+pending.length+')'],['listings','list','Barcha e’lonlar'],['lots','hammer','Auksion lotlari'],['users','user','Foydalanuvchilar'],['settings','settings','Sayt sozlamalari']].map(([v,i,l])=>`<a href="javascript:void(0)" onclick="adminTab='${v}';render()" class="${adminTab===v?'active':''}">${icon(i)}${l}</a>`).join('')}<a href="#/">${icon('home')}Saytga qaytish</a></nav></aside><section id="admin-content">${adminTab==='overview'?`<div class="stats">${[[all.length,'Jami e’lonlar'],[pending.length,'Moderatsiyada'],[lots.length,'Auksion lotlari'],[state.applications.length,'Demo arizalar']].map(([n,t])=>`<div class="stat"><small>${t}</small><strong>${n}</strong><span>Mahalliy demo ma’lumotlar</span></div>`).join('')}</div><div class="panel" style="margin-bottom:25px;padding-bottom:42px"><div class="section-head"><h3 style="margin:0">E’lonlar faolligi</h3><span class="badge pink">Namuna · 12 oy</span></div><div class="chart">${[35,48,40,65,53,74,62,86,77,95,84,100].map((n,i)=>`<div class="bar" style="height:${n}%"><span>${['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'][i]}</span></div>`).join('')}</div></div><div class="section-head"><h3 style="margin:0">Tekshiruvni kutayotgan e’lonlar</h3><button style="color:var(--pink);font-size:12px" onclick="adminTab='moderation';render()">Barchasi →</button></div>${pending.length?adminTable(pending):empty('Barcha e’lonlar tekshirildi','Yangi e’lon joylaganingizda shu yerda paydo bo‘ladi.','/post','E’lon qo‘shish')}`:adminTab==='moderation'?`<h2 style="margin-bottom:20px">E’lonlarni tekshirish</h2>${pending.length?adminTable(pending):empty('Tekshiruvda e’lon yo‘q','Yangi e’lonlar shu yerda ko‘rinadi.','/post','E’lon qo‘shish')}`:adminTab==='listings'?`<div class="section-head"><h2>Barcha e’lonlar</h2><input class="modal-search" style="width:220px" placeholder="E’lonni izlash" aria-label="Admin qidiruv" oninput="filterAdmin(this.value)"></div><div id="admin-table">${adminTable(all)}</div>`:adminTab==='lots'?`<div class="section-head"><h2>Auksion lotlari</h2><button class="btn primary small" onclick="editLot()">+ Lot qo‘shish</button></div><div class="table-wrap"><table><thead><tr><th>Lot №</th><th>Obyekt</th><th>Narx</th><th>Holat</th><th>Amallar</th></tr></thead><tbody>${lots.map(l=>`<tr><td>${l.id}</td><td><a href="#/auction/${l.id}">${esc(l.title)}</a></td><td>${money(l.price)}</td><td><span class="badge ${l.stage==='live'?'pink':'blue'}">${{new:'Yangi',live:'Joriy',ended:'Yakunlangan'}[l.stage]}</span></td><td><button class="iconbtn" onclick="editLot(${l.id})" aria-label="Lotni tahrirlash">${icon('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:adminTab==='users'?`<h2 style="margin-bottom:20px">Foydalanuvchilar</h2><div class="table-wrap"><table><thead><tr><th>Ism</th><th>Telefon</th><th>Rol</th><th>Holat</th></tr></thead><tbody>${(remoteUsers||[state.user||{name:'Demo foydalanuvchi',phone:'+998 00 000 00 00'},...base.slice(0,5).map(x=>({name:x.seller,phone:'Demo raqam'}))]).map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${i===0?'Foydalanuvchi':'Sotuvchi · namuna'}</td><td><span class="badge green">Faol (demo)</span></td></tr>`).join('')}</tbody></table></div><p class="tiny muted" style="margin-top:15px">Rol va ruxsatlarni boshqarish serverdagi autentifikatsiyaga ulanadi.</p>`:`<div class="panel"><h2 style="margin-bottom:22px">Sayt sozlamalari</h2><form onsubmit="saveAdminSettings(event)">${field('Platforma nomi','siteName','e-uylar','text',read('siteSettings',{}).siteName||'e-uylar',true)}${field('Aloqa emaili','supportEmail','support@e-uylar.uz','email',read('siteSettings',{}).supportEmail||'support@e-uylar.uz',true)}${field('Aloqa telefoni','supportPhone','+998','tel',read('siteSettings',{}).supportPhone||'')}<label class="check" style="margin:18px 0"><input type="checkbox" checked disabled> E’lonlar moderatsiyadan keyin chiqadi</label><p class="tiny muted">Sozlamalar demo xotiraga saqlanadi. Brend va aloqa ma’lumotlari footerda yangilanadi.</p><button class="btn primary">Sozlamalarni saqlash</button></form></div>`}</section></div></div></div>`}
function adminTable(ps){return `<div class="table-wrap"><table><thead><tr><th>E’lon</th><th>Narx</th><th>Holat</th><th>Amallar</th></tr></thead><tbody>${ps.map(p=>{let s=state.moderation[p.id]||p.status;return `<tr><td><div class="table-property"><img src="${photo(p)}" alt=""><div><a href="#/property/${p.id}">${esc(p.title)}</a><small>${esc(p.seller)} · ID ${p.id}</small></div></div></td><td>${money(p.price)} so‘m</td><td>${statusBadge(s)}</td><td><div style="display:flex;gap:5px"><a class="iconbtn" aria-label="Ko‘rish" href="#/property/${p.id}">${icon('eye')}</a>${state.own.some(x=>x.id===p.id)?`<a class="iconbtn" href="#/edit/${p.id}" aria-label="Tahrirlash">${icon('edit')}</a>`:''}${s!=='active'?`<button class="btn small" style="background:#e8f7ef;color:var(--green)" onclick="moderate(${p.id},'active')">✓ Tasdiqlash</button>`:''}${s!=='rejected'?`<button class="iconbtn" style="color:var(--pink)" aria-label="Rad etish" onclick="rejectPost(${p.id})">${icon('close')}</button>`:''}${s==='active'?`<button class="iconbtn" aria-label="Arxivlash" onclick="moderate(${p.id},'archived')">${icon('trash')}</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`}
function filterAdmin(q){document.getElementById('admin-table').innerHTML=adminTable([...state.own,...base].filter(p=>(p.title+' '+p.seller+' '+p.id).toLowerCase().includes(q.toLowerCase())))}
function demoModerate(id,status){state.moderation[id]=status;write('moderation',state.moderation);closeModal();render();toast(status==='active'?'Demo e’lon tasdiqlandi va katalogga qo‘shildi':status==='archived'?'Demo e’lon arxivlandi':'Demo e’lon rad etildi')}
function rejectPost(id){modal(`<h2>E’lonni rad etish</h2><form onsubmit="event.preventDefault();write('rejection_${id}',new FormData(event.target).get('reason'));moderate(${id},'rejected')"><div class="field"><label for="reject-reason">Sabab *</label><textarea id="reject-reason" name="reason" required placeholder="Rad etish sababini yozing"></textarea></div><button class="btn primary full">Rad etish</button></form>`)}
function editLot(id){const l=lots.find(l=>l.id===id)||{};modal(`<h2>${id?'Lotni tahrirlash':'Yangi demo lot'}</h2><form onsubmit="saveLot(event,${id||0})">${field('Lot nomi','title','Obyekt nomi','text',l.title||'',true)}<div class="two">${selectField('Hudud','region',regions.slice(1),l.region)}${field('Tuman','district','Tuman','text',l.district||'',true)}${field('Boshlang‘ich narx, so‘m','price','0','number',l.price||'',true)}${field('Maydon, m²','area','0','number',l.area||'',true)}${selectField('Turi','kind',['Yer uchastkasi','Davlat mulki','Bank mulki','Qishloq xo‘jaligi yeri'],l.kind)}${selectField('Holati','stage',[['new','Yangi'],['live','Joriy savdo'],['ended','Yakunlangan']],l.stage)}</div>${field('Savdo sanasi (Toshkent vaqti)','date','','datetime-local',l.date?.slice(0,16)||'',true)}<p class="tiny muted">Zakalat 20% hisoblanadi. Lot faqat demo katalogga saqlanadi.</p><button class="btn primary full">Saqlash</button></form>`,true)}
function demoSaveLot(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(+f.price<=0||+f.area<=0){toast('Narx va maydon noldan katta bo‘lsin');return}let l={...f,id:id||Math.floor(Date.now()/1000),price:+f.price,area:+f.area,deposit:+f.price*.2,photo:f.kind==='Yer uchastkasi'?3:1,date:f.date+':00+05:00'};let i=lots.findIndex(x=>x.id===id);i>=0?lots.splice(i,1,l):lots.push(l);write('lots',lots);closeModal();render();toast('Demo lot saqlandi')}
function saveAdminSettings(e){e.preventDefault();write('siteSettings',Object.fromEntries(new FormData(e.target)));renderFooter();toast('Demo sozlamalar saqlandi')}
function helpPage(){const faqs=[['E’lonni qanday joylayman?','“E’lon joylash” tugmasini bosing. Rasmlar, mulk turi, xususiyatlar, narx, manzil va aloqa ma’lumotlarini kiriting. Shartlarga rozilik bildirib tekshiruvga yuboring.'],['E’lonlar qanday tekshiriladi?','Yangi e’lon “Tekshiruvda” holatida saqlanadi. Demo admin panelda tasdiqlanganidan keyin katalogda ko‘rinadi.'],['Auksionga qanday ariza beriladi?','Lot sahifasidagi “Ariza berish” tugmasini bosing. Ushbu prototipda ariza faqat demo sifatida saqlanadi. Haqiqiy auksion yoki to‘lov bajarilmaydi.'],['Sevimli e’lonlarni qayerdan topaman?','Kartochkadagi yurakcha tugmasi orqali e’lonni saqlang. Saqlanganlar “Sevimlilar” bo‘limida turadi.'],['Demo ma’lumotlar qayerda saqlanadi?','E’lonlar, qoralama, sevimlilar va xabarlar shu brauzerning mahalliy xotirasida saqlanadi. Boshqa qurilmaga avtomatik o‘tmaydi.'],['Bu faylni qanday ishga tushiraman?','index.html faylini brauzerda oching. Dizayn, rasmlar va JavaScript bitta faylda; tashqi kutubxonalar talab qilinmaydi.']];return `<div class="container page">${breadcrumb('Yordam markazi')}<div style="max-width:820px;margin:auto"><div class="eyebrow">Sizga yordam beramiz</div><h1>Ko‘p so‘raladigan savollar</h1><p class="muted">e-uylar imkoniyatlaridan foydalanish bo‘yicha qo‘llanma</p><div class="section">${faqs.map(([q,a],i)=>`<details class="panel" style="margin-bottom:12px" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:600">${q}</summary><p style="font-size:13px;color:var(--muted);margin:15px 0 0">${a}</p></details>`).join('')}</div><div class="promo"><div><h3 style="margin:0">Savolingiz qoldimi?</h3><p>Platforma bo‘yicha murojaat qoldiring.</p></div><button class="btn primary" onclick="supportForm()">Bog‘lanish</button></div></div></div>`}
function supportForm(){modal(`<h2>Yordam markaziga murojaat</h2><form onsubmit="event.preventDefault();let a=read('support',[]);a.push(Object.fromEntries(new FormData(event.target)));write('support',a);closeModal();toast('Demo murojaat saqlandi. Tashqariga yuborilmadi.')">${field('Ismingiz','name','Ism','text','',true)}${field('Email','email','email@example.com','email','',true)}<div class="field"><label for="support-message">Murojaat *</label><textarea id="support-message" name="message" required></textarea></div><button class="btn primary full">Demo murojaat saqlash</button></form>`)}
function legalPage(kind){let privacy=kind==='privacy';return `<div class="container page legal">${breadcrumb(privacy?'Maxfiylik siyosati':'Foydalanish shartlari')}<span class="badge orange">Prototip uchun namunaviy matn</span><h1 style="margin-top:17px">${privacy?'Maxfiylik siyosati':'Foydalanish shartlari'}</h1><p class="muted">Bu bo‘lim UX/UI namunasidir. Haqiqiy xizmat ishga tushirilishidan oldin huquqiy matnlar alohida tayyorlanishi kerak.</p>${(privacy?[['Ma’lumotlar saqlanishi','Ushbu fayl demo e’lonlar, ism, telefon, sevimlilar va xabarlarni brauzerning localStorage xotirasida saqlaydi. Ma’lumotlar serverga yuborilmaydi.'],['Rasmlar','Siz tanlagan rasmlar brauzerda qayta ishlanadi va demo e’lon bilan mahalliy xotiraga saqlanadi. Shaxsiy hujjatlarni demo sifatida kiritmang.'],['Ma’lumotlarni o‘chirish','E’lonlaringizni kabinetdan o‘chirishingiz yoki brauzerdagi sayt ma’lumotlarini tozalashingiz mumkin.']]:[['Xizmatdan foydalanish','e-uylar ko‘chmas mulk platformasining interfeys namunasidir. Barcha dastlabki e’lonlar, sotuvchilar, narxlar va auksionlar demo ma’lumotlar hisoblanadi.'],['E’lonlar','E’lon beruvchi to‘g‘ri ma’lumot kiritishi va foydalanishga ruxsat etilgan rasmlarni joylashi kerak. E’lonlar demo moderatsiyadan o‘tadi.'],['Savdolar va to‘lovlar','Ushbu prototip to‘lov qabul qilmaydi, shartnoma tuzmaydi va rasmiy elektron auksionda ishtirok etish imkonini bermaydi.']]).map(([t,d])=>`<h2>${t}</h2><p>${d}</p>`).join('')}</div>`}
function notFound(){return `<div class="container page">${empty('Sahifa topilmadi','Havola o‘zgargan yoki e’lon o‘chirilgan bo‘lishi mumkin.','/','Bosh sahifaga qaytish')}</div>`}
function updateHeader(){document.getElementById('region-top').textContent=state.region;document.getElementById('favorites-link').innerHTML=icon('heart')+'<span>Sevimlilar</span>'+(state.favorites.length?`<span class="count">${state.favorites.length}</span>`:'');document.getElementById('listings-link').innerHTML=icon('list')+'<span>E’lonlarim</span>';document.getElementById('messages-link').innerHTML=icon('chat')+'<span>Xabarlar</span>';document.getElementById('account-link').innerHTML=icon('user')+`<span>${state.user?'Kabinet':'Kirish'}</span>`;let r=route(),active=r.path==='/listings'?(r.params.get('type')==='land'?'land':r.params.get('deal')||'sale'):r.path==='/projects'||r.path.startsWith('/project/')?'projects':r.path.startsWith('/auction')?'auctions':r.path==='/map'?'map':r.path==='/'?'home':'';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active));document.getElementById('bottomnav').innerHTML=[['/','home','Bosh sahifa'],['/favorites','heart','Sevimlilar'],['/post','plus','E’lon joylash'],['/messages','chat','Xabarlar'],['/profile','user','Kabinet']].map(([p,i,t])=>`<a href="#${p}" class="${r.path===p?'active':''} ${p==='/post'?'add':''}">${icon(i)}${t}</a>`).join('')}
function renderFooter(){let s=read('siteSettings',{});document.getElementById('footer').innerHTML=`<div class="container"><div class="footer-grid"><div><a href="#/" class="brand" style="color:var(--pink);font-size:29px">${esc(s.siteName||'e-uylar')}<span class="brand-dot">.</span></a><p>Yangi manzil sari birinchi qadamingiz.<br>Uylar, yerlar va imkoniyatlar bir joyda.</p><span class="badge">UX/UI prototip · Demo ma’lumotlar</span></div><div><strong>Ko‘chmas mulklar</strong><a href="#/listings?type=apartment">Kvartiralar</a><a href="#/listings?type=house">Hovli uylar</a><a href="#/listings?type=land">Yer uchastkalari</a><a href="#/listings?type=commercial">Tijorat mulki</a><a href="#/projects">Yangi uylar</a></div><div><strong>e-uylar haqida</strong><a href="#/help">Yordam markazi</a><a href="#/terms">Foydalanish shartlari</a><a href="#/privacy">Maxfiylik siyosati</a><a href="#/admin">Demo admin panel</a><a href="#/auctions">Auksionlar</a></div><div><strong>Biz bilan bog‘laning</strong><a href="mailto:${esc(s.supportEmail||'support@e-uylar.uz')}">${esc(s.supportEmail||'support@e-uylar.uz')}</a>${s.supportPhone?`<a href="tel:${esc(s.supportPhone)}">${esc(s.supportPhone)}</a>`:''}<a href="javascript:void(0)" onclick="supportForm()">Murojaat qoldirish →</a><div class="chips" style="margin-top:18px"><button class="chip" onclick="openLanguage()">🇺🇿 O‘zbekcha</button><span class="chip">UZS</span></div></div></div><div class="footer-bottom"><span>© 2026 ${esc(s.siteName||'e-uylar')}. Ko‘chmas mulk platformasi.</span><span>O‘zbekistonda, siz uchun yaratilgan ♡</span></div></div>`}
function renderView(){const r=route(),path=r.path;document.body.classList.toggle('form-bg',path==='/post'||path.startsWith('/edit/')||path==='/admin');let html='';if(path==='/')html=home();else if(path==='/listings')html=listings(r.params);else if(path.startsWith('/property/'))html=propertyPage(path.split('/')[2]);else if(path==='/map')html=mapPage(r.params);else if(path==='/auctions')html=auctions(r.params);else if(path.startsWith('/auction/'))html=auctionDetail(path.split('/')[2]);else if(path==='/projects')html=projectsPage();else if(path.startsWith('/project/'))html=projectDetail(path.split('/')[2]);else if(path==='/post')html=postPage();else if(path.startsWith('/edit/'))html=postPage(path.split('/')[2]);else if(path==='/success')html=successPage();else if(path==='/favorites')html=favoritesPage();else if(path==='/my-listings')html=myListingsPage();else if(path==='/profile')html=profilePage();else if(path==='/messages')html=messagesPage();else if(path==='/applications')html=applicationsPage();else if(path==='/saved-searches')html=savedSearchesPage();else if(path==='/admin')html=adminPage();else if(path==='/help')html=helpPage();else if(path==='/terms'||path==='/privacy')html=legalPage(path.slice(1));else html=notFound();document.getElementById('app').innerHTML=html;updateHeader();renderFooter();if(path==='/listings')drawResults();if(path==='/auctions')drawLots();if(path==='/map')resetMapSide();if(path==='/messages')drawChat();if(path==='/post'||path.startsWith('/edit/')){drawPhotoPreviews();syncForm();let el=document.getElementById('upload-area');if(el){el.ondragover=e=>{e.preventDefault();el.style.borderColor='var(--pink)'};el.ondragleave=()=>el.style.borderColor='';el.ondrop=e=>{e.preventDefault();el.style.borderColor='';uploadPhotos(e.dataTransfer.files)}}}document.title='e-uylar — '+(document.querySelector('#app h1')?.textContent||'O‘z uyingizni toping')}
document.getElementById('header-search')?.addEventListener('submit',e=>{e.preventDefault();navigate('/listings?q='+encodeURIComponent(document.getElementById('global-query').value.trim()))});
window.addEventListener('hashchange',()=>{if(document.getElementById('modal-root').innerHTML)closeModal();render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){let els=[...m.querySelectorAll('button,a,input,select,textarea,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
