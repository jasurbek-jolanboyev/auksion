function home(){const entries=repository.listings();return `<div class="container page home-page"><section class="home-hero"><div class="hero-copy"><div class="eyebrow">O‘zbekistonda yangi manzil sari</div><h1>Yashash uchun joy.<br><em>Hayot uchun uy.</em></h1><p>Shahar kvartirasidan shinam hovligacha.<br>O‘zingizga yaqin manzilni biz bilan toping.</p><div class="hero-actions"><a href="#/listings" class="btn primary">Mening uyimni topish ${icon('arrow')}</a><a href="#/map" class="text-link">${icon('map')}Xaritani ochish</a></div></div><div class="hero-visual"><div class="hero-photo"><img src="${PHOTOS[0]}" alt="Yashil hovlili zamonaviy turar joy majmuasi"><div class="hero-photo-caption"><span>SHAHAR ICHIDA, TABIATGA YAQIN</span><strong>Yangi hayot shu yerdan boshlanadi.</strong></div></div><div class="hero-note">${icon('key')}<div><strong>Yangi manzilingiz kutmoqda</strong><small>Tanlang. Solishtiring. Bog‘laning.</small></div></div><div class="hero-sticker">e.</div></div></section><section class="search-dock" aria-label="Ko‘chmas mulk qidiruvi"><div class="deal-tabs"><button class="active" data-hero-deal="sale" onclick="chooseHeroDeal('sale',this)">Sotib olish</button><button data-hero-deal="rent" onclick="chooseHeroDeal('rent',this)">Ijaraga olish</button><button onclick="navigate('/auctions')">Auksion</button><span class="dock-more">Manzilingizga bir qadam yaqinroq</span></div><form class="dock-fields" onsubmit="heroSearch(event)"><div class="dock-field"><label for="hero-type">Mulk turi</label><select id="hero-type" name="type"><option value="">Barcha mulklar</option value="apartment">Kvartira</option><option value="house">Hovli uy</option><option value="land">Yer uchastkasi</option><option value="commercial">Tijorat binosi</option></select></div><div class="dock-field"><label for="hero-region">Qaysi hududda?</label><select id="hero-region" name="region">${regions.map(r=>`<option ${r===state.region?'selected':''}>${r}</option>`).join('')}</select></div><div class="dock-field"><label for="hero-price">Byudjetingiz, so‘m</label><input id="hero-price" name="max" type="number" min="1" placeholder="Narx, gacha"></div><button class="btn primary">Izlash ${icon('arrow')}</button></form></section>${categoryTiles()}<section class="section"><div class="section-kicker"><span></span> Siz uchun tanladik</div><div class="section-head"><h2>Ko‘nglingizga yaqin manzillar</h2><a href="#/listings">Barchasini ko‘rish ↗</a></div><div class="chips" id="home-chips" style="margin-bottom:20px">${[['','Barchasi'],['apartment','Kvartiralar'],['house','Hovli uylar'],['land','Yerlar'],['commercial','Biznes uchun']].map(([t,l],i)=>`<button class="chip ${i===0?'active':''}" onclick="homeCategory('${t}',this)">${l}</button>`).join('')}</div><div class="grid five" id="home-cards">${entries.slice(0,4).map(card).join('')}</div></section><section class="owner-band">${icon('home')}<div><h2>Bu yerda sizning xaridoringiz ham bor.</h2><p>Mulkingiz haqida so‘zlab bering. Keyingi qadam — yangi imkoniyat.</p></div><a href="#/post" class="btn">E’lon joylash ${icon('plus')}</a></section><section class="section"><div class="section-kicker"><span></span> Quruvchilardan</div><div class="section-head"><div><h2>Kelajak manzilingiz</h2><p class="tiny muted" style="margin:7px 0 0">Zamonaviy majmualar, yangi imkoniyatlar.</p></div><a href="#/projects">Barcha majmualar ↗</a></div><div class="project-grid">${projects.map(projectCard).join('')}</div></section><section class="section"><div class="section-kicker"><span></span> Ochiq savdolar</div><div class="section-head"><div><h2>Imkoniyatni qo‘ldan boy bermang</h2><p class="tiny muted" style="margin:7px 0 0">Ko‘chmas mulk va yer uchastkalari auksioni.</p></div><a href="#/auctions">Lotlarni o‘rganish ↗</a></div><div class="auction-grid">${lots.slice(0,3).map(lotCard).join('')}</div></section>${recentlyViewed()}<section class="section"><div class="section-kicker"><span></span> Sizga yaqinroq</div><div class="section-head"><h2>Har hududning o‘z hikoyasi bor.</h2><button class="text-link" onclick="openRegion()">Hudud tanlash ↗</button></div><div class="cities">${['Toshkent','Samarqand','Buxoro','Toshkent viloyati'].map(r=>`<a class="city" href="#/listings?region=${encodeURIComponent(r)}">${icon('pin')}<div><strong>${r}</strong><small>${entries.filter(p=>p.region===r).length} ta manzilni o‘rganing →</small></div></a>`).join('')}</div></section><div class="app-banner-inline">${icon('shield')}<div><strong>Har bir suhbat — bir qadam yaqinroq.</strong><p>e-uylar ichida yozing, savollar bering va mulk egasi bilan kelishing.</p></div><button class="btn outline small" onclick="openAppPromo()">Xavfsiz muloqot ↗</button></div></div>`}

function updateHeader(){const r=route();document.getElementById('region-top').textContent=state.region;document.getElementById('favorites-link').innerHTML=icon('heart')+`<span>Saqlanganlar</span>${state.favorites.length?`<span class="count">${state.favorites.length}</span>`:''}`;document.getElementById('listings-link').innerHTML=icon('list')+'<span>E’lonlarim</span>';document.getElementById('messages-link').innerHTML=icon('chat')+'<span>Xabarlar</span>';document.getElementById('compare-link').innerHTML=icon('grid')+`<span>Solishtirish</span>${compareIds.length?`<span class="count">${compareIds.length}</span>`:''}`;document.getElementById('rail-home').innerHTML=icon('home')+'<span>Asosiy</span>';document.getElementById('rail-help').innerHTML=icon('shield')+'<span>Yordam</span>';document.getElementById('account-link').innerHTML=(state.user?`<span class="rail-avatar">${esc(state.user.name?.[0]||'E')}</span>`:icon('user'))+`<span>${state.user?'Kabinetim':'Kirish'}</span>`;let active=r.path.startsWith('/project')?'projects':r.path.startsWith('/auction')?'auctions':r.path==='/map'?'map':r.path==='/listings'?'sale':'';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active));document.querySelectorAll('[data-rail]').forEach(a=>a.classList.toggle('active',a.dataset.rail===r.path));document.getElementById('bottomnav').innerHTML=`<a href="#/" class="${r.path==='/'?'active':''}">${icon('home')}Asosiy</a><a href="#/listings" class="${r.path==='/listings'?'active':''}">${icon('filter')}Izlash</a><a href="#/post" class="add ${r.path==='/post'?'active':''}">${icon('plus')}E’lon berish</a><a href="#/favorites" class="${r.path==='/favorites'?'active':''}">${icon('heart')}Saqlanganlar</a><a href="javascript:void(0)" onclick="openAccountMenu()" class="${['/profile','/messages','/my-listings'].includes(r.path)?'active':''}">${icon('user')}Kabinet</a>`;drawCompareBar()}
function openAccountMenu(){const el=document.getElementById('account-popover-root');if(el.innerHTML){el.innerHTML='';return}el.innerHTML=`<div class="account-popover" role="navigation" aria-label="Kabinet menyusi"><strong>${esc(state.user?.name||'e-uylar kabineti')}</strong><small>${state.user?esc(state.user.phone):'O‘zingizga yaqin manzillar bir joyda'}</small>${!state.user?`<button onclick="closeAccountMenu();openLogin()">${icon('user')}Kirish / Ro‘yxatdan o‘tish</button>`:''}${[['my-listings','list','E’lonlarim'],['messages','chat','Xabarlar'],['notifications','clock','Bildirishnomalar'],['applications','hammer','Arizalarim'],['favorites','heart','Saqlanganlar'],['compare','grid','Solishtirish'],['saved-searches','filter','Qidiruvlarim'],['profile','settings','Sozlamalar']].map(([p,i,n])=>`<a href="#/${p}" onclick="closeAccountMenu()">${icon(i)}${n}</a>`).join('')}${state.user?`<button onclick="closeAccountMenu();logout()">${icon('logout')}Chiqish</button>`:''}<button onclick="closeAccountMenu()" style="border-top:1px solid var(--line);margin-top:6px">${icon('close')}Yopish</button></div>`}

el="Rasm tanlash">${imgs.map((src,i)=>`<button class="${i===0?'active':''}" data-thumb="${i}" onclick="selectPropertyImage(${p.id},${i},this)" aria-label="${i+1}-rasmni tanlash"><img src="${src}" alt="Rasm ${i+1}"></button>`).join('')}<button class="thumb-more" onclick="openGallery(${p.id},detailImageIndex)">${icon('photo')}Galereya</button></div><nav class="property-tabs" aria-label="E’lon bo‘limlari">${[['overview','Tafsilotlar'],['ask','Savol berish'],['address','Joylashuv'],['similar','O‘xshashlar']].map(([k,t],i)=>`<button class="${i===0?'active':''}" onclick="scrollPropertySection('${k}',this)">${t}</button>`).join('')}</nav><div class="property-content"><div><section class="detail-section" id="property-overview"><div class="overview-facts">${[[p.area+' m²','Umumiy maydon'],[p.rooms||'—','Xonalar'],[p.floor?p.floor+'/'+p.floors:p.land?p.land+' sotix':'—',p.floor?'Qavat':'Yer maydoni'],[money(Math.round(p.price/p.area)),'So‘m / m²']].map(([v,n])=>`<div><strong style="${String(v).length>8?'font-size:17px':''}">${v}</strong><span>${n}</span></div>`).join('')}</div><h3>Har bir tafsilot muhim.</h3><div class="specs">${[['Mulk turi',types[p.type]],['Bitim',deals[p.deal]],['Hudud',p.region],['Tuman',p.district],['Ta’mir holati',p.renovation||'Yevro ta’mir'],['Qurilish materiali',p.material||'G‘isht'],['Hujjat',p.propertyDocument||p.document||'Kadastr mavjud'],['Mulk egasi',p.ownerType||'Mulk egasi']].map(([k,v])=>`<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></section><section class="detail-section"><h3>Mulk haqida</h3><p style="font-size:13px;color:#7f8d77;line-height:1.95;white-space:pre-line">${esc(p.description||'Qulay hududda joylashgan, yorug‘ va shinam maskan. Yaqin atrofda maktab, bog‘cha, savdo do‘konlari va jamoat transporti mavjud.\n\nKommunikatsiyalar ulangan, ko‘rish vaqtini mulk egasi bilan oldindan kelishish mumkin. Qo‘shimcha savollaringizni quyida yozib qoldiring.')}</p><div class="chips">${amenities.map(a=>`<span class="chip">✓ ${esc(a)}</span>`).join('')}</div></section><section class="detail-section" id="property-ask"><div class="question-box"><h3>Yaxshi suhbat savoldan boshlanadi.</h3><p>Mulk egasidan to‘g‘ridan-to‘g‘ri so‘rang.</p><form onsubmit="askSeller(event,${p.id})"><input id="seller-question" name="question" aria-label="Sotuvchiga savol" value="Assalomu alaykum! Mulk hali sotuvdami?" maxlength="2000" required><button class="btn primary" aria-label="Savolni yuborish">${icon('arrow')}</button></form><div class="question-chips">${['Mulk hali sotuvdami?','Narxini kelishamizmi?','Qachon ko‘rish mumkin?','Kommunal to‘lovlar qancha?','Hujjatlar tayyormi?'].map((q,i)=>`<button class="${i===0?'active':''}" onclick="chooseQuestion(this)">${q}</button>`).join('')}</div></div></section><section class="detail-section" id="property-address"><div class="section-head"><h3 style="margin:0">Atrofni yaxshiroq biling.</h3><a href="#/map?type=${p.type}">Xaritada izlash ↗</a></div>${mapMarkup(0)}<div class="address-card">${icon('pin')}<div><strong>${esc(p.region)}, ${esc(p.district)}</strong><small>${esc(p.hideAddress?'Taxminiy joylashuv. Aniq manzilni egasidan so‘rang.':p.address||'Amir Temur ko‘chasi, 10-uy')}</small></div></div><div class="address-card">${icon('building')}<div><strong>Mo‘ljal</strong><small>${esc(p.landmark||'Jamoat transporti bekati yaqinida')}</small></div></div></section><div class="property-meta"><span>№ ${p.id} · ${esc(p.date)} ${icon('eye')} ${p.views||128}</span><button onclick="reportProperty(${p.id})">⚑ E’lon haqida shikoyat</button></div><div class="app-banner-inline">${icon('shield')}<div><strong>Muloqotingiz bir joyda.</strong><p>Savollar bering, kelishing va suhbatga qayting.</p></div><button class="btn outline small" onclick="openAppPromo()">Batafsil ↗</button></div></div><aside style="align-self:start" class="seller-panel"><div class="seller-panel-head"><span>MULK EGASI BILAN ALOQA</span><span>↗</span></div><div class="seller-panel-body"><a class="seller-profile-link" href="#/seller/${p.id}"><span class="avatar">${esc(p.seller?.[0]||'E')}</span><span><strong>${esc(p.seller||'Mulk egasi')} ↗</strong><small>Sotuvchining profilini ko‘rish</small></span></a><div class="response-info"><span class="response-dot"></span>Odatda kun davomida javob beradi</div><button class="btn primary" onclick="contactSeller(${p.id})">${icon('chat')}e-uylar chatida yozish</button><div class="two" style="gap:8px"><button class="btn outline" id="show-phone" onclick="showPhone(${p.id})">${icon('phone')}Telefon</button><button class="btn outline" onclick="openTelegram(${p.id})">${icon('arrow')}Telegram</button></div><button class="btn soft small" onclick="viewingRequest(${p.id})">${icon('clock')}Ko‘rish vaqtini belgilash</button><div class="safe-note">${icon('shield')}Mulk va hujjatlarni ko‘rib chiqing. Oldindan to‘lovga shoshilmang.</div><p class="tiny muted" style="margin:16px 0 0;font-size:9px">${CONFIG.mode==='demo'?'Namunaviy e’lon · aloqa va manzil demo':'Ma’lumotlar e’lon beruvchi tomonidan taqdim etilgan.'}</p><div class="seller-mini-promo"><h3>Endi navbat sizniki.</h3><p>Uy, yer yoki tijorat mulkingizni e-uylar orqali taklif qiling.</p><a href="#/post" class="text-link">E’lon joylash ${icon('arrow')}</a></div></div></aside></div><section class="section" id="property-similar" style="scroll-margin-top:150px"><div class="section-kicker"><span></span> Izlashda davom eting</div><div class="section-head"><h2>Sizga yana yoqishi mumkin</h2><a href="#/listings?type=${p.type}">Boshqa manzillar ↗</a></div><div class="grid">${repository.listings().filter(x=>x.id!==p.id).sort((a,b)=>(b.type===p.type)-(a.type===p.type)).slice(0,4).map(card).join('')}</div></section></div>`}
function selectPropertyImage(id,i,b){let p=repository.get(id);detailImageIndex=i;document.getElementById('property-main-image').src=propertyImages(p)[i];document.querySelectorAll('[data-thumb]').forEach(x=>x.classList.toggle('active',x===b))}
function scrollPropertySection(k,b){document.getElementById('property-'+k).scrollIntoView({behavior:'smooth'});document.querySelectorAll('.property-tabs button').forEach(x=>x.classList.toggle('active',x===b))}
function chooseQuestion(b){document.getElementById('seller-question').value='Assalomu alaykum! '+b.textContent;document.querySelectorAll('.question-chips button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('seller-question').focus()}
function drawGallery(){let p=repository.get(galleryState.id),imgs=propertyImages(p);galleryState.i=(galleryState.i+imgs.length)%imgs.length;modal(`<div class="section-kicker"><span></span>Manzilning har bir burchagi</div><h2>${esc(p.title)}</h2><img class="lightbox" src="${imgs[galleryState.i]}" alt="Mulk rasmi ${galleryState.i+1}"><div class="lightbox-controls"><button class="btn soft" aria-label="Oldingi rasm" onclick="galleryState.i--;drawGallery()">←</button><span>${galleryState.i+1} / ${imgs.length}</span><button class="btn soft" aria-label="Keyingi rasm" onclick="galleryState.i++;drawGallery()">→</button></div>`,true)}
function sellerPage(id){let p=repository.get(id);if(!p)return notFound();let ps=repository.listings().filter(x=>x.seller===p.seller);return `<div class="container page">${breadcrumb('Mulk egasi profili')}<section class="seller-cover"><div class="avatar">${esc(p.seller?.[0]||'E')}</div><div><h1>${esc(p.seller||'Mulk egasi')}</h1><p>${esc(p.region)} · e-uylar foydalanuvchisi</p><div class="seller-metrics"><span>✓ ${ps.length} ta faol e’lon</span><span>Odatda kun davomida javob beradi</span><span>2026-yildan beri</span></div></div><button class="btn" onclick="contactSeller(${p.id})">${icon('chat')}Xabar yozish</button></section><div class="section-head"><h2>Sotuvchining manzillari</h2><span class="tiny muted">${ps.length} ta e’lon</span></div><div class="grid">${ps.map(card).join('')}</div><div class="integration-note">${CONFIG.mode==='demo'?'Bu namunaviy profil. Baho va tekshirilganlik haqidagi tasdiqlanmagan da’volar kiritilmagan.':'Sotuvchiga oid ma’lumotlar platformadagi e’lonlardan olindi.'}</div></div>`}
function viewingRequest(id){let p=repository.get(id);modal(`<div class="eyebrow">Manzil bilan yaqindan tanishing</div><h2>Mulkni qachon ko‘rmoqchisiz?</h2><p class="muted">${esc(p.title)}</p><form onsubmit="submitViewing(event,${id})"><div class="two">${field('Sana','visit-date','','date','',true)}${field('Qulay vaqt','visit-time','','time','',true)}</div>${field('Ismingiz','visit-name','Ism','text',state.user?.name||'',true)}${field('Telefon','visit-phone','+998 90 123 45 67','tel',state.user?.phone||'',true)}<label class="check" style="margin-bottom:20px"><input type="checkbox" required>Ma’lumotlarni mulk egasiga taqdim etishga roziman</label><p class="tiny muted">${CONFIG.mode==='demo'?'Demo so‘rov brauzerda saqlanadi. Uchrashuv tasdiqlanmaydi.':'Vaqt mulk egasi tasdiqlaganidan keyin kelishilgan hisoblanadi.'}</p><button class="btn primary full">So‘rov yuborish</button></form>`);document.getElementById('visit-date').min=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function appVisual(){return `<div class="app-illustration"><div class="phone-mock"><strong>e-uylar.</strong><img class="phone-property" src="${PHOTOS[0]}" alt="e-uylar ilovasi konsepti"><div class="phone-bubble">Assalomu alaykum! Uyni qachon ko‘rsam bo‘ladi?</div><div class="phone-bubble mine">Bugun 18:00 da sizga qulaymi?</div><div class="phone-bubble">Albatta. Rahmat!</div><div style="margin-top:15px;border:1px solid #dbe3cb;border-radius:7px;padding:6px;font-size:8px;color:#a8b099">Xabar yozing… →</div></div><div class="shield-art">${icon('shield')}</div></div>`}
function appPromoContent(full=false){return `<div class="app-promo-modal">${appVisual()}<div class="app-promo-copy"><span class="badge green">Muloqotga yaqinroq</span><h2>Har bir savolingiz<br>o‘z javobini topsin.</h2><p>Mulk egasi bilan e-uylar chatida yozing. Savollar, kelishuvlar va manzillar — bir suhbatda.</p><ul><li>✓ E’lon bilan bog‘langan suhbat</li><li>✓ Tezkor savollar va qulay kelishuv</li><li>✓ Saqlangan manzillarga oson qaytish</li></ul><button class="btn primary" onclick="closeModal();navigate('/messages')">Veb chatni ochish ${icon('arrow')}</button>${CONFIG.appStoreUrl||CONFIG.playStoreUrl?`<button class="btn outline" onclick="showAppLinks()">Ilovani yuklab olish</button>`:`<button class="btn outline" onclick="subscribeApp()">Mobil ilova haqida xabar olish</button>`}<p class="tiny">Mobil ilova — konsept. Rasmiy yuklab olish manzillari sozlanmaguncha fayl yuklanmaydi.</p></div></div>`}
function openAppPromo(){modal(appPromoContent(),true)}
function appPage(){return `<div class="container page">${breadcrumb('e-uylar ilovasi')}<div class="app-page">${appPromoContent(true)}</div><section class="section" style="max-width:900px;margin:20px auto"><div class="three">${[['chat','Suhbatlar bir joyda','Har bir e’lon bo‘yicha alohida yozing.'],['heart','Manzillarni saqlang','Sizga yoqqan mulklarni keyinroq ko‘ring.'],['shield','Xabardor bo‘ling','Shartlarni aniqlang, hujjatlarni tekshiring.']].map(([i,t,d])=>`<div class="panel">${icon(i)}<h3 style="margin:14px 0 9px">${t}</h3><p class="tiny muted">${d}</p></div>`).join('')}</div></section></div>`}
function subscribeApp(){modal(`<div class="eyebrow">e-uylar bilan qoling</div><h2>Mobil ilova tayyor bo‘lganda xabar beramiz.</h2><form onsubmit="submitSubscription(event)">${field('Elektron pochta','email','siz@example.com','email','',true)}<label class="check" style="margin:15px 0 22px"><input type="checkbox" required>Mobil ilova yangiliklarini olishga roziman.</label><button class="btn primary full">Obuna bo‘lish</button></form><p class="tiny muted" style="margin-top:15px">${CONFIG.mode==='demo'?'Demo rejimda faqat ushbu brauzerda saqlanadi.':'Obunani istalgan payt bekor qilish mumkin.'}</p>`)}
function showAppLinks(){let safe=u=>/^https:\/\//.test(u||'');modal(`<h2>e-uylar ilovasini yuklab olish</h2><p class="muted">Platformangizni tanlang</p>${safe(CONFIG.appStoreUrl)?`<a class="btn primary full" href="${esc(CONFIG.appStoreUrl)}" target="_blank" rel="noopener">App Store ↗</a>`:''}${safe(CONFIG.playStoreUrl)?`<a class="btn outline full" style="margin-top:10px" href="${esc(CONFIG.playStoreUrl)}" target="_blank" rel="noopener">Google Play ↗</a>`:''}`)}
function toggleCompare(id){if(compareIds.includes(id))compareIds=compareIds.filter(x=>x!==id);else if(compareIds.length>=3){toast('Bir vaqtda 3 ta mulkni solishtiring');return}else compareIds.push(id);write('compare',compareIds);document.querySelectorAll(`[data-compare="${id}"]`).forEach(b=>b.classList.toggle('active',compareIds.includes(id)));if(route().path==='/compare')render();else{updateHeader();toast(compareIds.includes(id)?'Solishtirishga qo‘shildi':'Solishtirishdan olindi')}}
function drawCompareBar(){let el=document.getElementById('compare-root');el.innerHTML=compareIds.length&&route().path!=='/compare'?`<div class="compare-float"><a href="#/compare">${compareIds.length} ta manzil · Solishtirish →</a><button aria-label="Solishtirishni tozalash" onclick="compareIds=[];write('compare',[]);updateHeader()">×</button></div>`:''}
function comparePage(){let ps=compareIds.map(id=>repository.get(id)).filter(Boolean);return `<div class="container page">${breadcrumb('Manzillarni solishtirish')}<div class="section-head"><div><div class="eyebrow">Tanlovingiz yanada aniqroq</div><h1>Qaysi biri sizga yaqin?</h1><p class="tiny muted">Uchta manzilni yonma-yon solishtiring.</p></div><a class="btn outline" href="#/listings">+ Yana manzil tanlash</a></div>${ps.length?`<div class="compare-grid">${ps.map(p=>`<article class="compare-property"><img src="${photo(p)}" alt="${esc(p.title)}"><h3 style="margin:17px 0 12px"><a href="#/property/${p.id}">${esc(p.title)}</a></h3><div class="price">${money(p.price)} <small style="font-size:11px">so‘m${p.deal==='rent'?' / oy':''}</small></div><div class="specs" style="margin-top:20px">${[['Maydon',p.area+' m²'],['Xonalar',p.rooms||'—'],['Qavat',p.floor?p.floor+'/'+p.floors:'—'],['Hudud',p.region],['Tuman',p.district],['Bitim',deals[p.deal]],['Mulk turi',types[p.type]]].map(([k,v])=>`<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><a class="btn primary" style="width:100%;margin-top:18px" href="#/property/${p.id}">Manzilni ko‘rish</a><button class="btn soft small" style="width:100%;margin-top:8px" onclick="toggleCompare(${p.id})">Ro‘yxatdan olish</button></article>`).join('')}</div>`:empty('Hali solishtirishga manzil tanlanmagan','Mulk sahifasidagi katakcha belgisini bosing.','/listings','Manzillarni ko‘rish')}</div>`}
function notificationsPage(){let n=read('notifications',[]);return accountLayout('notifications','Bildirishnomalar',n.length?`<div class="panel">${n.slice().reverse().map(x=>`<div class="notification-item">${icon(x.icon||'clock')}<div><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><small>${new Date(x.date).toLocaleString('uz-UZ',{timeZone:'Asia/Tashkent'})}</small></div></div>`).join('')}</div>`:empty('Hozircha yangilik yo‘q','E’lon, murojaat va arizalaringizdagi o‘zgarishlar shu yerda ko‘rinadi.','/my-listings','E’lonlarim'))}
function notify(title,text,ic='clock'){let n=read('notifications',[]);n.push({title,text,icon:ic,date:new Date().toISOString()});write('notifications',n)}
function renderFooter(){let s=read('siteSettings',{});document.getElementById('footer').innerHTML=`<div class="container"><div class="footer-feature"><h2>Yangi manzil — yangi hikoya.</h2><a href="#/post" class="btn">O‘z manzilingizni taklif qiling ${icon('arrow')}</a></div><div class="footer-grid"><div><a href="#/" class="brand">e-uylar<span class="brand-dot">.</span></a><p>Uylar, yerlar va yangi boshlanishlar.<br>O‘zingizga yaqin manzilni toping.</p><span class="api-status">${CONFIG.mode==='demo'?'Interaktiv dizayn · Demo rejim':'Ulangan xizmat'}</span></div><div><strong>Manzil tanlang</strong><a href="#/listings?type=apartment">Kvartiralar</a><a href="#/listings?type=house">Hovli uylar</a><a href="#/listings?type=land">Yerlar</a><a href="#/projects">Yangi uylar</a><a href="#/auctions">Auksion lotlari</a></div><div><strong>Bir qadam yaqinroq</strong><a href="#/app">e-uylar ilovasi</a><a href="#/help">Yordam markazi</a><a href="#/terms">Foydalanish shartlari</a><a href="#/privacy">Maxfiylik</a><a href="#/admin">Boshqaruv paneli</a></div><div><strong>Sizni eshitamiz</strong><a href="javascript:void(0)" onclick="supportForm()">Murojaat qoldirish ↗</a>${s.supportEmail?`<a href="mailto:${esc(s.supportEmail)}">${esc(s.supportEmail)}</a>`:''}<a href="javascript:void(0)" onclick="openLanguage()">O‘zbekcha · UZS</a><a href="javascript:void(0)" onclick="openRegion()">${esc(state.region)} ⌄</a></div></div><div class="footer-bottom"><span>© 2026 e-uylar. Hayot uchun manzil.</span><span>O‘zbekistonda, siz uchun.</span></div></div>`}

const CONFIG=Object.freeze({mode:'demo',apiBaseUrl:'',csrfToken:'',appStoreUrl:'',playStoreUrl:'',...(window.EUYLAR_CONFIG||{})});
let apiReady=CONFIG.mode!=='api',routeDataKey='',routeLoadSerial=0,remotePageData=null;
let remoteUsers=null;
const api={
 async request(path,{method='GET',body,headers={},signal}={}){
  const baseUrl=CONFIG.apiBaseUrl.replace(/\/$/,'');
  if(!baseUrl)throw new Error('API manzili sozlanmagan. EUYLAR_CONFIG.apiBaseUrl ni kiriting.');
  const csrf=CONFIG.csrfToken||document.querySelector('meta[name="csrf-token"]')?.content;
  const h={Accept:'application/json',...headers};if(csrf)h['X-CSRF-Token']=csrf;
  if(body&&!(body instanceof FormData)){h['Content-Type']='application/json';body=JSON.stringify(body)}
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{const res=await fetch(baseUrl+path,{method,headers:h,body,credentials:'include',signal:signal||controller.signal});let json=null;const ct=res.headers.get('content-type')||'';if(res.status!==204){if(!ct.includes('json'))throw new Error('Server JSON javob qaytarishi kerak. API yo‘lini tekshiring.');json=await res.json()}if(!res.ok){if(res.status===401){state.user=null;updateHeader()}throw new Error(json?.message||(res.status===403?'Bu amal uchun ruxsat yetarli emas.':res.status===401?'Davom etish uchun tizimga kiring.':'Server so‘rovni bajara olmadi ('+res.status+').'))}return json?.data??json}
  catch(e){if(e.name==='AbortError')throw new Error('So‘rov vaqti tugadi. Qayta urinib ko‘ring.');if(e instanceof TypeError)throw new Error('Serverga ulanib bo‘lmadi. Internet, API manzili va CORS sozlamalarini tekshiring.');throw e}finally{clearTimeout(timer)}
 },
 get(path){return this.request(path)},post(path,body){return this.request(path,{method:'POST',body})},patch(path,body){return this.request(path,{method:'PATCH',body})},put(path,body){return this.request(path,{method:'PUT',body})},delete(path){return this.request(path,{method:'DELETE'})}
};
function items(data){return Array.isArray(data)?data:data?.items||[]}
function safeSrc(s){s=String(s||'');return /^(data:image\/(jpeg|png|webp);base64,|https?:\/\/)/i.test(s)?esc(s):PHOTOS[0]}
function normalizeProperty(p){return {...p,id:+p.id,price:+p.price||0,area:+p.area||1,rooms:+p.rooms||0,image:p.image||p.images?.[0],images:(p.images||[]).filter(s=>/^https?:\/\//.test(s)),status:p.status||'active',photo:p.photo||0,date:p.date||''}}
function mergeProperty(p){p=normalizeProperty(p);let i=base.findIndex(x=>x.id===p.id);i<0?base.unshift(p):base.splice(i,1,p);return p}
function setProperties(data){const ps=items(data).map(normalizeProperty);base.splice(0,base.length,...ps);return ps}
function setArray(target,data){target.splice(0,target.length,...items(data))}

async function runAction(fn,btn=null){if(btn){btn.disabled=true;btn.dataset.label=btn.textContent;btn.textContent='Bajarilmoqda…'}try{return await fn()}catch(e){toast(e.message||'Amal bajarilmadi. Qayta urinib ko‘ring.');return null}finally{if(btn?.isConnected){btn.disabled=false;btn.textContent=btn.dataset.label}}}
async function bootstrapApi(){loading(true,'e-uylar xizmatiga ulanmoqda…');try{const data=await api.get('/bootstrap');state.user=data.user||null;state.favorites=data.favorites||[];state.own=(data.own||[]).map(normalizeProperty);state.chat={};state.applications=[];state.moderation={};base.splice(0);projects.splice(0);lots.splice(0);if(data.settings)write('siteSettings',data.settings);apiReady=true;routeDataKey='';render()}catch(e){document.getElementById('app').innerHTML=`<div class="container page">${empty('Xizmatga ulanib bo‘lmadi',esc(e.message),'/','Bosh sahifa')}<button class="btn primary" style="margin-top:15px" onclick="bootstrapApi()">Qayta ulanish</button></div>`}finally{loading(false)}}
async function loadApiRoute(r,key){const seq=++routeLoadSerial;loading(true);try{const path=r.path,q=r.params;let jobs=[];
 if(path==='/'||path==='/listings'||path==='/map'||path==='/compare'){let query=new URLSearchParams(q);if(path==='/listings'){query.set('page',String(state.page||1));query.set('pageSize','9');query.set('sort',document.getElementById('sort')?.value||'new')}else if(path==='/compare')query.set('ids',compareIds.join(','));else if(path==='/map')query.set('view','map');else query.set('limit','12');jobs.push(api.get('/properties?'+query).then(d=>{if(seq!==routeLoadSerial)return;setProperties(d);remotePageData={items:items(d).map(normalizeProperty),total:d.total??items(d).length,page:d.page||1,pageSize:d.pageSize||9}}));if(path==='/')jobs.push(api.get('/projects').then(d=>setArray(projects,d)),api.get('/lots').then(d=>setArray(lots,d)))}
 else if(path.startsWith('/property/'))jobs.push(api.get('/properties/'+path.split('/')[2]).then(d=>{if(d.related)setProperties(d.related);mergeProperty(d.property||d)}));
 else if(path.startsWith('/seller/'))jobs.push(api.get('/properties/'+path.split('/')[2]+'/seller').then(d=>{setProperties(d.properties||[]);if(d.property)mergeProperty(d.property)}));
 else if(path==='/projects')jobs.push(api.get('/projects').then(d=>setArray(projects,d)));
 else if(path.startsWith('/project/'))jobs.push(api.get('/projects/'+path.split('/')[2]).then(p=>{let i=projects.findIndex(x=>x.id===p.id);i<0?projects.push(p):projects.splice(i,1,p)}));
 else if(path==='/auctions')jobs.push(api.get('/lots').then(d=>setArray(lots,d)));
 else if(path.startsWith('/auction/'))jobs.push(api.get('/lots/'+path.split('/')[2]).then(l=>{let i=lots.findIndex(x=>x.id===l.id);i<0?lots.push(l):lots.splice(i,1,l)}));
 else if(path==='/my-listings')jobs.push(api.get('/me/properties').then(d=>{state.own=items(d).map(normalizeProperty)}));
 else if(path.startsWith('/edit/'))jobs.push(api.get('/properties/'+path.split('/')[2]).then(d=>{let p=normalizeProperty(d.property||d);state.own=state.own.filter(x=>x.id!==p.id).concat(p)}));
 else if(path==='/favorites')jobs.push(api.get('/me/favorites').then(d=>{state.favorites=d.ids||items(d).map(x=>+x.id);for(const p of d.items||[])mergeProperty(p)}));
 else if(path==='/messages')jobs.push(api.get('/conversations').then(d=>{state.chat=Object.fromEntries(items(d).map(c=>[String(c.id),c]));if(!state.chat[state.chatId])state.chatId=Object.keys(state.chat)[0]}));
 else if(path==='/applications')jobs.push(api.get('/me/applications').then(d=>{state.applications=items(d).map(a=>({...a,id:+(a.lotId||a.id)}));for(const a of items(d))if(a.lot&&!lots.some(x=>x.id===a.lot.id))lots.push(a.lot)}));
 else if(path==='/saved-searches')jobs.push(api.get('/me/saved-searches').then(d=>write('savedsearches',items(d))));
 else if(path==='/notifications')jobs.push(api.get('/me/notifications').then(d=>write('notifications',items(d))));
 else if(path==='/admin')jobs.push(api.get('/admin/overview').then(d=>{setProperties(d.properties||[]);state.own=[];setArray(lots,d.lots||[]);remoteUsers=d.users||[];if(d.settings)write('siteSettings',d.settings)}));
 await Promise.all(jobs);if(seq!==routeLoadSerial)return;routeDataKey=key;render();
 }catch(e){if(seq!==routeLoadSerial)return;document.getElementById('app').innerHTML=`<div class="container page">${breadcrumb('Xatolik')}<div class="empty">${icon('shield')}<h3>Ma’lumotni olib bo‘lmadi</h3><p>${esc(e.message)}</p><button class="btn primary" onclick="routeDataKey='';render()">Qayta urinish</button>${!state.user?'<button class="btn outline" style="margin-left:10px" onclick="openLogin()">Kirish</button>':''}</div></div>`}finally{if(seq===routeLoadSerial)loading(false)}}

async function saveSearch(){await runAction(async()=>{await saveResource('/me/saved-searches','savedsearches',{query:location.hash,date:new Date().toISOString(),name:state.filters.q||types[state.filters.type]||'Ko‘chmas mulklar'});toast('Qidiruv saqlandi')})}
async function removeSavedSearch(i){await runAction(async()=>{let a=read('savedsearches',[]);if(CONFIG.mode==='api')await api.delete('/me/saved-searches/'+a[i].id);a.splice(i,1);write('savedsearches',a);render()})}
async function saveProfile(e){e.preventDefault();let f=new FormData(e.target),phone=f.get('profile-phone');if(!validPhone(phone)){toast('Telefonni +998 XX XXX XX XX shaklida kiriting');return}await runAction(async()=>{let d={name:f.get('profile-name'),phone,email:f.get('profile-email'),region:f.get('profile-region'),notificationPreferences:{messages:f.has('notify-messages'),auctions:f.has('notify-auctions')}};if(CONFIG.mode==='api'){state.user=await api.patch('/me',d)}else{state.user={name:d.name,phone:d.phone};write('user',state.user)}state.region=d.region;write('region',state.region);write('profile',{email:d.email,messages:d.notificationPreferences.messages,auctions:d.notificationPreferences.auctions});updateHeader();toast('Sozlamalar saqlandi')},e.target.querySelector('button'))}
async function saveDraft(){syncForm();await runAction(async()=>{await saveResource('/me/drafts','draftRecords',{...state.form,draftImages:state.uploads});if(!write('draft',{...state.form,draftImages:state.uploads}))throw new Error('Qoralama uchun joy yetarli emas. Rasmlarni kamaytiring.');toast('Qoralama saqlandi')})}
async function uploadApiImages(){return Promise.all(state.uploads.map(async(s,i)=>{if(/^https?:\/\//.test(s))return s;const m=s.match(/^data:(image\/[\w+.-]+);base64,(.*)$/);if(!m)throw new Error('Rasm formati noto‘g‘ri.');let bin=atob(m[2]),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);let f=new FormData();f.append('file',new Blob([a],{type:m[1]}),'property-'+i+'.jpg');let result=await api.post('/uploads',f);if(!result?.url)throw new Error('Server rasm manzilini qaytarmadi.');return result.url}))}
async function publishPost(e){e.preventDefault();syncForm();const d=state.form;let error='';if(!state.uploads.length)error='Kamida bitta rasm qo‘shing.';else if(+d.area<=0||+d.price<=0)error='Maydon va narx noldan katta bo‘lishi kerak.';else if(d.floor&&d.floors&&+d.floor>+d.floors)error='Qavat bino qavatlari sonidan oshmasin.';else if(!validPhone(d.phone))error='Telefonni +998 XX XXX XX XX shaklida kiriting.';if(error){document.getElementById('post-error').textContent=error;document.getElementById('post-error').scrollIntoView({block:'center',behavior:'smooth'});return}if(!state.user){openLogin(()=>publishPost({preventDefault(){}}));return}if(CONFIG.mode==='demo'){demoPublishPost({preventDefault(){}});notify('E’loningiz qabul qilindi','E’lon moderatsiya navbatiga qo‘shildi.','home');return}await runAction(async()=>{let images=await uploadApiImages(),id=+d.editId||null;let payload={...d,price:+d.price,area:+d.area,rooms:+d.rooms,floor:+d.floor,floors:+d.floors,images};delete payload.editId;delete payload.draftImages;let p=await (id?api.patch('/properties/'+id,payload):api.post('/properties',payload));p=normalizeProperty(p.property||p);state.own=state.own.filter(x=>x.id!==p.id).concat(p);state.form={};state.uploads=[];write('draft',{});routeDataKey='';navigate('/success?kind=post')},document.querySelector('#post-publish button[type=submit],#post-publish button:last-child'))}
function deleteOwn(id){modal(`<h2>E’lonni o‘chirasizmi?</h2><p class="muted">Ushbu amalni tasdiqlang.</p><div class="two"><button class="btn soft" onclick="closeModal()">Ortga qaytish</button><button class="btn primary" onclick="confirmDeleteOwn(${id})">O‘chirish</button></div>`)}
async function confirmDeleteOwn(id){await runAction(async()=>{if(CONFIG.mode==='api')await api.delete('/properties/'+id);state.own=state.own.filter(x=>x.id!==id);if(CONFIG.mode==='demo')write('own',state.own);closeModal();routeDataKey='';render();toast('E’lon o‘chirildi')})}
async function moderate(id,status){await runAction(async()=>{if(CONFIG.mode==='api'){await api.patch('/admin/properties/'+id,{status,reason:read('rejection_'+id,'')});routeDataKey='';closeModal();render()}else{demoModerate(id,status);notify('E’lon holati yangilandi','№ '+id+' · '+({active:'Tasdiqlandi',rejected:'Rad etildi',archived:'Arxivlandi'})[status],'shield')}})}
async function saveLot(e,id){e.preventDefault();if(CONFIG.mode==='demo'){demoSaveLot(e,id);return}let f=Object.fromEntries(new FormData(e.target));if(+f.price<=0||+f.area<=0){toast('Narx va maydon noldan katta bo‘lsin');return}await runAction(async()=>{let d={...f,price:+f.price,area:+f.area,deposit:+f.price*.2,date:f.date+':00+05:00'};await(id?api.patch('/admin/lots/'+id,d):api.post('/admin/lots',d));closeModal();refreshRoute();toast('Lot saqlandi')},e.target.querySelector('button'))}
async function saveAdminSettings(e){e.preventDefault();await runAction(async()=>{let d=Object.fromEntries(new FormData(e.target));if(CONFIG.mode==='api')await api.patch('/admin/settings',d);write('siteSettings',d);renderFooter();toast('Sozlamalar saqlandi')},e.target.querySelector('button'))}
async function submitLot(e,id){e.preventDefault();if(CONFIG.mode==='demo'){demoSubmitLot(e,id);notify('Demo ariza saqlandi','Lot № '+id+' bo‘yicha ariza mahalliy saqlandi.','hammer');return}await runAction(async()=>{let d=Object.fromEntries(new FormData(e.target)),a=await api.post('/lots/'+id+'/applications',{...d,consent:true});state.applications.push({...a,id:+(a.lotId||id)});closeModal();refreshRoute();toast('Arizangiz qabul qilindi')},e.target.querySelector('button'))}
function applyLot(id){if(!state.user){openLogin(()=>applyLot(id));return}const l=lots.find(l=>l.id===id);if(!l||l.stage==='ended'){toast('Arizalar qabuli yopilgan');return}modal(`<div class="eyebrow">Ochiq savdo</div><h2>${CONFIG.mode==='demo'?'Demo ariza':'Ishtirok uchun ariza'}</h2><p class="muted">Lot № ${id} · ${esc(l.title)}</p><form onsubmit="submitLot(event,${id})">${field('F.I.Sh.','fullname','Ism va familiya','text',state.user.name,true)}${field('Telefon','lotphone','+998 90 123 45 67','tel',state.user.phone,true)}<div class="panel" style="padding:15px;background:var(--bg);margin-bottom:20px"><div class="info-pair"><span>Zakalat puli</span><strong>${money(l.deposit)} so‘m</strong></div><span class="badge orange">${CONFIG.mode==='demo'?'Demo · to‘lov olinmaydi':'Zakalat holati serverda tekshiriladi'}</span></div><label class="check" style="margin-bottom:20px"><input type="checkbox" required> Savdo shartlarini o‘qidim va roziman.</label><button class="btn primary full">${CONFIG.mode==='demo'?'Demo arizani saqlash':'Ariza yuborish'}</button></form>`)}
async function lotDocument(id,i){if(CONFIG.mode==='demo'){demoLotDocument(id,i);return}await runAction(async()=>{let d=await api.get('/lots/'+id+'/documents/'+i);if(!/^https?:\/\//.test(d.url||''))throw new Error('Hujjat manzili noto‘g‘ri.');modal(`<h2>${esc(d.title||'Lot hujjati')}</h2><p class="muted">Hujjat yangi oynada ochiladi.</p><a class="btn primary full" href="${esc(d.url)}" target="_blank" rel="noopener">Hujjatni ochish ↗</a>`)})}
function applicationsPage(){if(CONFIG.mode==='demo')return demoApplicationsPage();return accountLayout('applications','Arizalarim',state.applications.length?`<div class="table-wrap"><table><thead><tr><th>Lot</th><th>Sana</th><th>Holat</th><th></th></tr></thead><tbody>${state.applications.map(a=>`<tr><td>№ ${a.id}</td><td>${esc(a.date||'')}</td><td><span class="badge">${esc(a.status||'Qabul qilindi')}</span></td><td><a href="#/auction/${a.id}" class="btn outline small">Lotni ko‘rish</a></td></tr>`).join('')}</tbody></table></div>`:empty('Hozircha ariza yo‘q','Lotlarni o‘rganing va savdo shartlari bilan tanishing.','/auctions','Lotlarni ko‘rish'))}
function successPage(){return `<div class="container page"><div class="success"><div class="success-icon">${icon('check')}</div><div class="eyebrow">Yangi imkoniyat sari</div><h1>E’loningiz qabul qilindi.</h1><p class="muted" style="max-width:460px;margin:0 auto 25px">${CONFIG.mode==='demo'?'Demo e’lon brauzerda saqlandi. Boshqaruv panelida tasdiqlangandan keyin katalogda chiqadi.':'Tekshiruv holatini shaxsiy kabinetdan kuzating.'}</p><div class="chips" style="justify-content:center"><a href="#/my-listings" class="btn primary">E’lonlarimni ko‘rish</a><a href="#/" class="btn outline">Bosh sahifaga</a></div></div></div>`}
function openLanguage(){modal(`<h2>Sayt tili</h2><div class="region-list"><button onclick="closeModal();toast('O‘zbekcha tanlandi')">O‘zbekcha <span>✓</span></button></div><p class="muted">Ushbu interfeys o‘zbek tilida. Qo‘shimcha tillar tarjima to‘plami ulanganidan keyin qo‘shiladi.</p>`)}
function drawResults(){if(CONFIG.mode==='demo'){demoDrawResults();return}const d=remotePageData||{items:[],total:0,page:1,pageSize:9},sort=document.getElementById('sort')?.value||'new';let ps=[...d.items];if(sort==='asc')ps.sort((a,b)=>a.price-b.price);if(sort==='desc')ps.sort((a,b)=>b.price-a.price);if(sort==='area')ps.sort((a,b)=>b.area-a.area);document.getElementById('result-count').textContent=d.total+' ta e’lon topildi';document.getElementById('results').innerHTML=ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:empty('Mos manzil topilmadi','Filtrlarni o‘zgartirib ko‘ring.');document.getElementById('pagination').innerHTML=d.total>d.pageSize?`<div class="pagination">${Array.from({length:Math.min(Math.ceil(d.total/d.pageSize),10)},(_,i)=>`<button class="${d.page===i+1?'active':''}" onclick="apiResultPage(${i+1})">${i+1}</button>`).join('')}</div>`:''}
async function apiResultPage(page){await runAction(async()=>{let q=new URLSearchParams(route().params);q.set('page',String(page));q.set('pageSize','9');q.set('sort',document.getElementById('sort').value);const d=await api.get('/properties?'+q);setProperties(d);remotePageData={...d,items:items(d).map(normalizeProperty),page:d.page||page,pageSize:d.pageSize||9,total:d.total??items(d).length};drawResults();window.scrollTo({top:84,behavior:'smooth'})})}
async function changeSort(){if(CONFIG.mode==='api')await apiResultPage(1);else drawResults()}
// Read-only view fallbacks are never seeded from demo fixtures in API mode.
if(CONFIG.mode==='api'){apiReady=false;queueMicrotask(bootstrapApi)}
document.addEventListener('click',e=>{if(!e.target.closest('.account-popover,#account-link,.bottomnav a:last-child'))closeAccountMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAccountMenu();if(document.querySelector('.lightbox')){if(e.key==='ArrowLeft'){galleryState.i--;drawGallery()}if(e.key==='ArrowRight'){galleryState.i++;drawGallery()}}});

base.forEach(p=>{if(p.type==='apartment')p.photo=4});
const savedLots=read('lots',null);if(Array.isArray(savedLots)&&savedLots.length)lots.splice(0,lots.length,...savedLots);
updateHeader();renderFooter();render();
if(!read('cookie',false))document.getElementById('cookie-root').innerHTML=`<div class="cookie"><div>${icon('shield')}</div><p>Qulay ishlash uchun tanlovlaringiz ushbu brauzerda saqlanadi. <a href="#/privacy" style="color:var(--pink)">Batafsil</a></p><button class="btn primary small" onclick="write('cookie',true);document.getElementById('cookie-root').innerHTML=''">Tushunarli</button></div>`;
</script>
